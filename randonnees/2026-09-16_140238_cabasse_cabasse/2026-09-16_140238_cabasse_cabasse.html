var wps=[{"name":"Départ","lat":43.4274817,"lon":6.2218417,"alt":193.09,"comment":"","photo":null,"photoExternal":null,"audio":null,"video":null,"youtube":null},{"name":"Sapin d'Andalousie","lat":43.4267717,"lon":6.220150000000001,"alt":199.01,"comment":"Vigoureux conifère des montagnes méditerranéennes, le « sapin d’Andalousie » évoque une rencontre improbable entre l’âpreté du Sud et les hautes forêts ibériques. Ses aiguilles courtes, épaisses et disposées autour des rameaux lui donnent une silhouette compacte, presque architecturale. Adapté aux sols calcaires et aux ambiances montagnardes, il supporte des conditions contrastées : sécheresse estivale, froid hivernal et forte insolation. Un arbre qui semble avoir transporté un fragment de Sierra Nevada jusque dans nos paysages provençaux.","photo":"photos/omimg_20260916_140620.jpg","photoExternal":null,"audio":null,"video":null,"youtube":null},{"name":"Monument des résistants de Cabasse","lat":43.43149901223305,"lon":6.219286988809811,"alt":0,"comment":"Érigé en mémoire des résistants de Cabasse, ce monument rappelle que la Libération s’est aussi jouée dans les villages et les collines de l’arrière-pays. Dès 1943, autour de Louis Cavallini, un groupe clandestin s’organise parmi les mineurs, gendarmes et habitants. Le 11 novembre 1943, bravant les autorités d’Occupation, Cavallini et ses compagnons déposent au monument aux morts une gerbe ornée d’un ruban tricolore portant une croix de Lorraine. Un geste symbolique, mais lourd de sens : la Résistance était déjà là, sous les yeux de l’occupant.","photo":"photos/omimg_20260916_144309.jpg","photoExternal":null,"audio":null,"video":null,"youtube":null},{"name":"Cabasse, le village","lat":43.43188692631835,"lon":6.220491383604347,"alt":0,"comment":"Dominant la vallée de l'Issole depuis son promontoire, Cabasse se dévoile soudain aux randonneurs au détour d'un sentier calcaire. Ce vieux bourg varois, traversé jadis par la Via Aurelia, déploie un bel amphithéètre de toits patinés par le soleil et cerné de verdure. Du haut de ce point de vue, le contraste est saisissant entre l'aridité des crêtes environnantes et la fraîcheur luxuriante de la ripisylve en contrebas. C'est un véritable livre d'histoire minérale et provençale qui s'ouvre sous nos yeux, idéal pour immortaliser l'étape.","photo":"photos/omimg_20260916_144458.jpg","photoExternal":null,"audio":null,"video":null,"youtube":null},{"name":"Antennes","lat":43.43242134280539,"lon":6.220981739774656,"alt":0,"comment":"Dominant le village de Cabasse, les antennes-relais installées sur les hauteurs constituent un repère familier dans le paysage provençal. Leur position en altitude n’est pas fortuite : dégagées des obstacles topographiques, elles permettent d’optimiser la propagation des ondes radioélectriques et la couverture du territoire. Depuis ce belvédère, leur présence offre un contraste saisissant entre infrastructures contemporaines et reliefs calcaires du Centre-Var. Ces équipements, souvent discrets dans notre quotidien, rappellent que le paysage rural est désormais parcouru d’un invisible réseau .","photo":"photos/omimg_20260916_144643.jpg","photoExternal":null,"audio":null,"video":null,"youtube":null},{"name":"Château Réquier","lat":43.43345055540468,"lon":6.222329135556024,"alt":0,"comment":"Le vignoble du Château Réquier s’étend dans les paysages viticoles de Cabasse, au cœur de la Provence varoise. Implantées sur les coteaux et les terrasses de la vallée de l’Issole, les vignes bénéficient d’un climat méditerranéen marqué par un fort ensoleillement et des amplitudes thermiques favorables à la maturation des raisins. Le domaine élabore des vins rouges, rosés et blancs en AOC Côtes de Provence, exprimant la diversité des cépages et des terroirs calcaires de cette partie du Var.\n","photo":"photos/omimg_20260916_150143.jpg","photoExternal":null,"audio":null,"video":null,"youtube":null},{"name":"Filaire à feuilles larges","lat":43.43575086971749,"lon":6.223605332567612,"alt":0,"comment":"Le filaire à feuilles larges est une plante vivace discrète des sous-bois frais et ombragés, reconnaissable à ses larges feuilles ovales, disposées par paires le long de tiges dressées. Au printemps, de petites fleurs verdâtres, parfois teintées de brun, apparaissent à l’aisselle des feuilles. Cette espèce affectionne les sols riches en humus et les stations relativement fraîches. Son feuillage dense contraste avec celui des plantes méditerranéennes plus xérophiles qui dominent les secteurs calcaires et ensoleillés de Provence.","photo":"photos/omimg_20260916_150910.jpg","photoExternal":null,"audio":null,"video":null,"youtube":null},{"name":"Notre-Dame-du-Glaive","lat":43.43766976304502,"lon":6.22342948104361,"alt":0,"comment":"Nichée sur une crête abrupte dominant Cabasse, la chapelle Notre-Dame-du Glaive tire son origine d'une légende poignante. Selon la tradition, un berger aurait découvert au XIVe siècle une statue de la Vierge transpercée par un glaive après qu'un vœu a sauvé le village de la peste. Bâtie sur ce site panoramique balayé par les vents, elle incarna longtemps la ferveur protectrice des habitants. Un lieu empreint de mystère, où l'histoire religieuse se mêle aux vestiges d'un ancien poste de vigie.","photo":"photos/omimg_20260916_152005.jpg","photoExternal":null,"audio":null,"video":null,"youtube":null},{"name":"Filaire à feuilles larges","lat":43.43887821214268,"lon":6.223354232722135,"alt":0,"comment":"Le filaire à feuilles larges (Phillyrea latifolia) est un arbuste méditerranéen persistant, pouvant atteindre plusieurs mètres de hauteur. Ses feuilles, coriaces, opposées, ovales à elliptiques et finement dentées, sont d’un vert sombre et luisant sur la face supérieure. Au printemps, de petites fleurs blanchâtres, discrètes mais mellifères, se regroupent à l’aisselle des feuilles. Elles donnent ensuite des drupes ovoïdes, d’abord vertes puis noir violacé à maturité. Typique des garrigues et des forêts thermophiles, il résiste remarquablement à la sécheresse.","photo":"photos/omimg_20260916_152233.jpg","photoExternal":null,"audio":null,"video":null,"youtube":null},{"name":"Genévrier de Phénicie","lat":43.43947433106288,"lon":6.222736869692039,"alt":0,"comment":"Contrairement au genévrier cade ou commun aux aiguilles piquantes, le genévrier de Phénicie (Juniperus phoenicea) se distingue par son feuillage persistant en écailles douces, rappelant le cyprès. Autre particularité majeure : ses cônes charnus à maturité prennent une teinte rouge vif à brun-rouge. Amateur de garrigues arides et de falaises calcaires en Provence, ce résistant tolère la sécheresse extrême et adopte souvent un port tortueux sculpté par le mistral, lui conférant une silhouette unique.","photo":"photos/omimg_20260916_152344.jpg","photoExternal":null,"audio":null,"video":null,"youtube":null},{"name":"Arbousier","lat":43.44029024958594,"lon":6.222184345607253,"alt":0,"comment":"L’arbousier, ou « arbre aux fraises », est un hôte familier des collines siliceuses et des maquis de Provence. Son nom latin, Arbutus unedo, évoque une curieuse prudence : selon Pline l’Ancien, « un seul » suffit, allusion à son fruit réputé peu savoureux lorsqu’il est consommé en grande quantité. Particularité remarquable, l’arbousier porte simultanément ses fleurs blanches en clochettes et ses fruits rouges, mûrs à l’automne. Ses baies, riches en sucres, sont traditionnellement utilisées pour confectionner confitures, gelées et eau-de-vie.","photo":"photos/omimg_20260916_152555.jpg","photoExternal":null,"audio":null,"video":null,"youtube":null},{"name":"Chêne mort","lat":43.44106434106628,"lon":6.221594164891455,"alt":0,"comment":"Ce chêne mort n’est pas un arbre inutile : il devient progressivement un véritable réservoir de biodiversité. Son bois, d’abord colonisé par les champignons et les insectes saproxyliques, se creuse peu à peu sous l’action des larves et de la décomposition. Une cavité peut ensuite servir d’abri à des chauves-souris, des oiseaux cavernicoles ou de petits mammifères. Même couché au sol, le tronc poursuit son rôle écologique : il restitue lentement au sol les éléments minéraux accumulés durant plusieurs décennies de croissance.","photo":"photos/omimg_20260916_152858.jpg","photoExternal":null,"audio":null,"video":null,"youtube":null},{"name":"Calament népéta","lat":43.44224250621095,"lon":6.219513458012522,"alt":0,"comment":"Le calament népéta se reconnaît à ses petites feuilles ovales, opposées, légèrement dentées et surtout à leur puissant parfum mentholé lorsqu’on les froisse. De juin à l’automne, ses tiges dressées portent de petites fleurs rose violacé, regroupées à l’aisselle des feuilles. Cette Lamiacée vivace affectionne les pelouses sèches, lisières et rocailles, souvent sur substrat calcaire. Pour l’identifier sur le terrain, le trio feuilles opposées, tige quadrangulaire et odeur aromatique constitue un excellent indice.","photo":"photos/omimg_20260916_155954.jpg","photoExternal":null,"audio":null,"video":null,"youtube":null},{"name":"Cornouiller sanguin","lat":43.44318085538855,"lon":6.219885810354342,"alt":0,"comment":"Le cornouiller sanguin se reconnaît d’abord à ses jeunes rameaux, souvent rouge sombre, particulièrement visibles en hiver. Ses feuilles opposées, ovales et à nervures arquées, prennent à l’automne des teintes écarlates qui expliquent son nom. Au printemps, de petites fleurs blanches se réunissent en inflorescences aplaties ; elles donnent en fin d’été de petites drupes bleu-noir. Arbuste des lisières, haies et bois clairs, il apprécie les sols calcaires et participe volontiers à la dynamique de recolonisation des milieux ouverts.","photo":"photos/omimg_20260916_160111.jpg","photoExternal":null,"audio":null,"video":null,"youtube":null},{"name":"L'Issole","lat":43.44296452114757,"lon":6.221635254667158,"alt":0,"comment":"L’Issole est une petite rivière du Var, affluent de l’Argens, qui prend sa source dans le secteur de Mazaugues avant de traverser le Centre-Var. Son régime méditerranéen est marqué par de fortes variations saisonnières : paisible en été, elle peut devenir torrentueuse après les épisodes pluvieux intenses. Son nom serait d’origine ancienne et pourrait se rattacher à une racine hydronymique préromaine. À Cabasse, son cours accompagne un paysage où collines calcaires, ripisylve et vignobles se côtoient.","photo":"photos/omimg_20260916_160343.jpg","photoExternal":null,"audio":null,"video":null,"youtube":null},{"name":"Pont sur l'Issole","lat":43.4436499,"lon":6.2222743,"alt":0,"comment":"Le pont de la D13 franchit l’Issole dans un secteur où la rivière traverse une plaine alluviale étroite, au pied du relief de Cabasse. En amont, le cours d’eau s’inscrit dans un lit marqué par des niveaux de tuf calcaire, témoins d’une précipitation carbonatée active ou ancienne. La proximité du croisement avec la D79, qui se dirige vers Le Thoronet, fait de cet ouvrage un repère routier majeur. La zone est régulièrement soumise aux débordements de l’Issole, révélant la dynamique de cette petite rivière méditerranéenne","photo":"photos/omimg_20260916_160543.jpg","photoExternal":null,"audio":null,"video":null,"youtube":null},{"name":"Falaise du Casteou Sarrin","lat":43.44339118930449,"lon":6.223212117760816,"alt":0,"comment":"Le hameau du Cateou Sarrin, aujourd’hui rattaché à Cabasse, conserve dans son toponyme la trace d’une occupation rurale ancienne. Le nom, dont l’orthographe a pu varier au fil des siècles, associe vraisemblablement un terme désignant un lieu ou un domaine à un ancien nom propre. Comme beaucoup de microtoponymes provençaux, il témoigne d’un paysage autrefois organisé autour des mas, des cultures et des parcours pastoraux. Ces noms ont souvent survécu alors même que les activités qui les avaient fait naître ont disparu","photo":"photos/omimg_20260916_163732.jpg","photoExternal":null,"audio":null,"video":null,"youtube":null},{"name":"Sous le Trou des Fées","lat":43.44213997050326,"lon":6.224037181692673,"alt":0,"comment":"Le « Trou des Fées », à Cabasse, doit son nom à une tradition populaire qui habille les cavités et les escarpements rocheux de la présence mystérieuse des fées. Dans l’imaginaire provençal, ces êtres surnaturels étaient volontiers associés aux grottes, sources et lieux retirés, réputés propices aux apparitions. Le toponyme ne désigne donc pas nécessairement une cavité exceptionnelle par sa morphologie, mais perpétue une ancienne lecture légendaire du paysage. Ici, la géologie devient décor de conte : la roche conserve le nom, tandis que la fée demeure invisible.","photo":"photos/omimg_20260916_164052.jpg","photoExternal":null,"audio":null,"video":null,"youtube":null},{"name":"Falaise de Notre-Dame-du-Glaive","lat":43.43847379689565,"lon":6.231703381223999,"alt":0,"comment":"La falaise de Notre-Dame du Glaive domine Cabasse par une paroi calcaire spectaculaire, dont les strates redressées composent un véritable livre géologique à ciel ouvert. Ses surfaces compactes, fissures et ressauts ont également retenu l’attention des grimpeurs : le site offre plusieurs lignes d’escalade où la lecture du relief se double d’une lecture tactile de la roche. Entre verticalité, adhérence et prises sculptées par l’érosion, le grimpeur évolue ici dans un paysage où la géomorphologie devient terrain de jeu.","photo":"photos/omimg_20260916_165507.jpg","photoExternal":null,"audio":null,"video":null,"youtube":null},{"name":"Clos Réquier","lat":43.43255110950213,"lon":6.232939774247361,"alt":0,"comment":"Au Clos Réquier, le vin exprime un terroir provençal marqué par le soleil, les sols calcaires et la relative sécheresse du climat. Les rouges se distinguent généralement par une robe soutenue, des arômes de fruits noirs et d’épices, soutenus par une trame tannique qui leur confère structure et longueur. Les rosés privilégient fraîcheur, fruit et finesse, tandis que les blancs développent des notes florales et fruitées, avec une vivacité bienvenue. L’ensemble recherche l’équilibre entre maturité solaire et fraîcheur minérale.","photo":"photos/omimg_20260916_170530.jpg","photoExternal":null,"audio":null,"video":null,"youtube":null},{"name":"Chemin de Croix IV","lat":43.42809642951255,"lon":6.228337415151373,"alt":0,"comment":"La quatrième station du chemin de croix représente la rencontre de Jésus avec sa mère, Marie, sur le chemin qui le conduit au Golgotha. Cette scène, absente des récits évangéliques, appartient à la tradition chrétienne et à la méditation de la Passion. Elle met en scène un bref face-à-face silencieux, où la souffrance de la mère répond à celle du fils chargé de sa croix. Dans la succession des stations, cet épisode introduit une dimension profondément humaine : au cœur du supplice, le lien familial demeure intact.","photo":"photos/omimg_20260916_171331.jpg","photoExternal":null,"audio":null,"video":null,"youtube":null},{"name":"Sureau hièble","lat":43.4267751,"lon":6.2260938,"alt":0,"comment":"Le sureau hièble (Sambucus ebulus) se reconnaît à son port herbacé : contrairement au sureau noir, il ne forme pas un véritable arbuste ligneux mais disparaît presque entièrement en hiver. Ses tiges dressées atteignent 1 à 2 m et portent de grandes feuilles opposées, composées de folioles lancéolées et dentées, à odeur forte lorsqu’on les froisse. De juin à août, des corymbes de fleurs blanches s’épanouissent au sommet des tiges, puis donnent des baies noires, toxiques, orientées vers le haut.","photo":"photos/omimg_20260916_171940.jpg","photoExternal":null,"audio":null,"video":null,"youtube":null},{"name":"Chemin de Croix","lat":43.42621008064383,"lon":6.224993147489554,"alt":0,"comment":"En Provence, les chemins de croix jalonnent souvent les abords des villages, chapelles et sanctuaires, inscrivant la dévotion chrétienne directement dans le paysage. Constitués de quatorze stations représentant les épisodes de la Passion du Christ, ils étaient parcourus lors des pèlerinages ou des exercices de piété, particulièrement durant le Carême et la Semaine sainte. Croix de pierre, niches ou petits édicules ponctuent ainsi les anciens itinéraires. À Cabasse comme ailleurs, ces modestes monuments témoignent d’une pratique religieuse qui associait marche, méditation et mémoire collective.","photo":"photos/omimg_20260916_172305.jpg","photoExternal":null,"audio":null,"video":null,"youtube":null},{"name":"Arrivée","lat":43.4276733,"lon":6.22197,"alt":180.68,"comment":"Grande randonnée Heure de départ: 14:02 16 sept. 2026 Heure d'arrivée: 17:35 16 sept. 2026 Distance: 7,7km (03:33) Temps déplacement: 02:04 Vitesse moyenne: 2,16 km/h Vitesse en mouvement: 3,71 km/h Vitesse Max.: 7,29 km/h Altitude minimale: 178 m Altitude maximale: 340 m Vitesse de montée: 181,2 m/h Vitesse de descente: 234,5 m/h Dénivelé positif: 185 m Dénivelé négatif: 193 m Temps de montée: 01:01 Temps de descente: 00:49","photo":null,"photoExternal":null,"audio":null,"video":null,"youtube":null}];
