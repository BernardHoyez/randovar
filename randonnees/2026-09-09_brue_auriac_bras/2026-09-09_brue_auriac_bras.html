<script>
var wps=[{"name":"Départ","lat":43.49741,"lon":5.950695000000001,"alt":260.23,"comment":"Randonnée pilotée par Jean-Marc\nMercredi 9 septembre 2026","photo":null,"photoExternal":null,"audio":null,"video":null,"youtube":null},{"name":"Confluence","lat":43.4974783,"lon":5.95025,"alt":254.01,"comment":"À cet endroit précis, le Cauron rejoint l'Argens selon un angle de confluence relativement aigu, révélateur d'un ajustement hydrodynamique progressif entre deux cours d'eau d'ordre différent. On observe un contraste net dans la turbidité et la granulométrie des sédiments charriés, signature de bassins versants aux lithologies distinctes. Ce point de jonction constitue également une zone de dépôt alluvial préférentielle, où l'énergie combinée des flux favorise la sédimentation de matériaux grossiers en période de crue, tandis que les étiages exposent des bancs de galets remaniés.","photo":"photos/omimg_20260909_141619.jpg","photoExternal":null,"audio":null,"video":null,"youtube":null},{"name":"Chêne","lat":43.50326,"lon":5.953846700000001,"alt":247.46,"comment":"Sous l'écorce tourmentée de ce vénérable chêne pubescent se cache un véritable écosystème relicte, gardien silencieux des anciens pacages. En 1944, les maquisards de la Haute-Provence utilisèrent sa haute frondaison multicentenaire comme boîte aux lettres vivante, glissant les messages codés dans une cavité naturelle colmatée par les ans. Ses racines puissantes, ancrées dans la dalle calcaire, témoignent d'une résilience face aux sécheresses estivales successives et aux violents épisodes cévenols. Observez la cupule de ses glands et la marcescence de ses feuilles brunies .","photo":"photos/omimg_20260909_143927.jpg","photoExternal":null,"audio":null,"video":null,"youtube":null},{"name":"Chapelle Notre-Dame","lat":43.5201867,"lon":5.94099,"alt":284.71,"comment":"Isolée sur une petite hauteur, au bord de l’ancien cimetière, la chapelle Notre-Dame de Brue-Auriac veille silencieusement sur la plaine. D’origine romane, son histoire remonte au XIᵉ siècle, lorsqu’elle dépendait de la puissante abbaye Saint-Victor de Marseille. Plusieurs fois transformée, elle fut longtemps l’église paroissiale de Brue et d’Auriac. Après la construction de l’église Saint-Georges au cœur du village, elle retrouva son rôle de chapelle du cimetière. Inscrite aux Monuments historiques depuis 1971, elle conserve le charme austère des édifices romans provençaux.\n","photo":"photos/omimg_20260909_160304.jpg","photoExternal":null,"audio":null,"video":null,"youtube":null},{"name":"Fronton","lat":43.5201867,"lon":5.9411317,"alt":285.81,"comment":"La sculpture que vous avez photographiée représente bien le Christ, mais sous une forme assez particulière. On distingue une figure frontale, les bras levés, les mains largement ouvertes, un nimbe circulaire autour de la tête et un vêtement richement orné. Il s'agit vraisemblablement d'un Christ en majesté / Christ glorieux, plutôt que d'un Christ en croix.\nElle avait été bûchée, probablement à la Révolution, puis volée peu avant 1980. \nLa main droite bénit et la main gauche tient Le Livre.","photo":"photos/omimg_20260909_160349.jpg","photoExternal":null,"audio":null,"video":null,"youtube":null},{"name":"Buis","lat":43.4987767,"lon":5.941716699999999,"alt":340.69,"comment":"Le buis commun (Buxus sempervirens) est un arbuste clé des sous-bois provençaux, très présent sur les sols calcaires du Luberon ou de la Sainte-Baume.\n\nAdaptation : Ses petites feuilles coriaces et persistantes lui permettent de supporter la sécheresse estivale.\n\nUsage : Sa croissance très lente donne un bois extrêmement dense, prisé en artisanat pour le tournage et les ustensiles.\n\nMenace : Depuis les années 2010, les forêts méditerranéennes subissent des ravages massifs causés par la pyrale du buis, une chenille invasive.","photo":"photos/omimg_20260909_170454.jpg","photoExternal":null,"audio":null,"video":null,"youtube":null},{"name":"Chicorée","lat":43.4998633,"lon":5.95125,"alt":255.19,"comment":"La chicorée sauvage (Cichorium intybus), aux fleurs bleu azur, borde les chemins rocailleux et le maquis du Var.\n\nL'horloge du paysan : Ses fleurs s'ouvrent à l'aube et se referment dès midi face à la chaleur. Les anciens l'utilisaient comme repère temporel.\n\nLe café de disette : Durant les pénuries, ses racines récoltées dans la campagne varoise étaient torréfiées pour pallier le manque de café.\n\nDans l'assiette : Ses jeunes pousses amères composent traditionnellement la salade sauvage provençale du printemps.","photo":"photos/omimg_20260909_174342.jpg","photoExternal":null,"audio":null,"video":null,"youtube":null},{"name":"Argens","lat":43.4975733,"lon":5.9503133,"alt":255.78,"comment":"Né dans les Alpes-de-Haute-Provence, l’Argens traverse le Var sur près de 116 km avant de se jeter dans la Méditerranée entre Fréjus et Saint-Aygulf. Ce fleuve côtier, l’un des plus importants de Provence, reçoit de nombreux affluents, dont la Bresque, l’Aille et la Nartuby. Son nom viendrait d’une racine préromaine évoquant l’idée d’« eau brillante ». Capricieux, l’Argens peut grossir brutalement lors des pluies méditerranéennes, transformant paisibles berges et plaines en zones inondables.","photo":"photos/omimg_20260909_175041.jpg","photoExternal":null,"audio":null,"video":null,"youtube":null},{"name":"Arrivée","lat":43.497365,"lon":5.95085,"alt":249.4,"comment":"Grande randonnée\n\nHeure de départ: 14:15 9 sept. 2026\nHeure d'arrivée: 17:52 9 sept. 2026\n\nDistance: 10,2km \nTemps déplacement: 02:42\nVitesse moyenne: 2,81 km/h\nVitesse en mouvement: 3,76 km/h\nVitesse Max.: 6,80 km/h\nAltitude minimale: 232 m\nAltitude maximale: 349 m\nVitesse de montée: 199,3 m/h\nVitesse de descente: 186,3 m/h\nDénivelé positif: 212 m\nDénivelé négatif: 217 m\n\nTemps de montée: 01:03\nTemps de descente: 01:10","photo":null,"photoExternal":null,"audio":null,"video":null,"youtube":null}];
