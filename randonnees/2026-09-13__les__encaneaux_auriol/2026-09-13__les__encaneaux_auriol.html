<script>
var wps=[{"name":"Départ","lat":43.3506583,"lon":5.6602867,"alt":253.91,"comment":"Grande randonnée\n\nHeure de départ: 09:08 13 sept. 2026\nHeure d'arrivée: 16:27 13 sept. 2026\nDistance: 11,5km (07:19)\nTemps déplacement: 04:10\nVitesse moyenne: 1,57 km/h\nVitesse en mouvement: 2,75 km/h\nVitesse Max.: 14,03 km/h\nAltitude minimale: 241 m\nAltitude maximale: 669 m\nVitesse de montée: 190,7 m/h\nVitesse de descente: 119,3 m/h\nDénivelé positif: 523 m\nDénivelé négatif: 528 m\nTemps de montée: 02:44\nTemps de descente: 04:25","photo":null,"photoExternal":null,"audio":null,"video":null,"youtube":null},{"name":"Pancarte","lat":43.3495083,"lon":5.660705000000001,"alt":0,"comment":"Depuis les Encanaux, le massif de la Sainte-Baume se dresse comme une imposante muraille calcaire, dominant les paysages de l’arrière-pays varois. Sa longue barre rocheuse, orientée d’est en ouest, atteint 1 148 m au Joug de l’Aigle. Ses falaises blanches contrastent avec les versants boisés, où la hêtraie conserve une fraîcheur étonnante sous le climat méditerranéen. Cette montagne abrite également la grotte de Sainte-Marie-Madeleine, haut lieu spirituel établi dans une cavité de la falaise.","photo":"photos/omimg_20260913_091641.jpg","photoExternal":null,"audio":null,"video":null,"youtube":null},{"name":"Glacière","lat":43.34836,"lon":5.6601983,"alt":266.88,"comment":"La glacière des Encanaux témoigne d’une activité autrefois essentielle en Provence : la conservation et le commerce de la glace naturelle. Creusée dans le sol et soigneusement isolée, cette construction permettait d’entreposer la neige et la glace récoltées durant l’hiver. Transformées en blocs, elles étaient conservées jusqu’à la belle saison, puis acheminées vers les villes et les lieux de villégiature. Avant l’arrivée de la réfrigération moderne, cette glace était précieuse pour rafraîchir boissons, aliments et préparations médicinales.","photo":"photos/omimg_20260913_092442.jpg","photoExternal":null,"audio":null,"video":null,"youtube":null},{"name":"Glacière 2","lat":43.3481667,"lon":5.6601767,"alt":0,"comment":"Construite en 1698 par la commune d'Auriol dans le massif de la Sainte-Baume, la glacière des Encanaux est un puits maçonné cylindrique destiné autrefois à stocker la glace naturelle récoltée en hiver pour la revendre aux beaux jours. Récemment restaurée, cette structure caractéristique aux parois plus étroites à la base se niche au cœur du vallon boisé des Encanaux, constituant une étape remarquable et pleine de fraîcheur très prisée des randonneurs.","photo":"photos/omimg_20260913_092612.jpg","photoExternal":null,"audio":null,"video":null,"youtube":null},{"name":"Le Bau Rouge","lat":43.3485133,"lon":5.66207,"alt":292.58,"comment":"Le Bau Rouge, au sud d’Auriol, est un relief calcaire caractéristique du pays de l’Étoile et de la bordure méridionale du massif de la Sainte-Baume. Son nom évoque la teinte roussâtre que prennent localement les affleurements rocheux sous l’effet de l’altération et de l’oxydation du fer. Le relief domine les vallons boisés qui descendent vers l’Huveaune. Dans ce paysage méditerranéen, la roche affleurante alterne avec les pinèdes, les garrigues et les espaces agricoles, offrant un bel exemple de la transition entre plaine et relief provençal.\n","photo":"photos/omimg_20260913_093133.jpg","photoExternal":null,"audio":null,"video":null,"youtube":null},{"name":"Barre calcaire","lat":43.3459467,"lon":5.660923299999999,"alt":326.67,"comment":"","photo":"photos/omimg_20260913_094301.jpg","photoExternal":null,"audio":null,"video":null,"youtube":null},{"name":"Bau Redon","lat":43.344995,"lon":5.6615067,"alt":369.48,"comment":"Le Bau Redon, près des Encanaux, est un petit promontoire calcaire qui domine le ravin des Infernets, à l’est d’Auriol. Son sommet, vers 480 m d’altitude, s’atteint par un sentier raide depuis le pont des Encanaux. Son nom associe bau, terme provençal désignant un escarpement rocheux, et redon, qui signifie « rond » ou « arrondi ». Depuis le sommet, le relief offre une belle vue sur les ravins boisés et la vallée d’Auriol.","photo":"photos/omimg_20260913_095824.jpg","photoExternal":null,"audio":null,"video":null,"youtube":null},{"name":"Croix","lat":43.3447433,"lon":5.6610367,"alt":372.97,"comment":"Les croix qui ponctuent les sommets et les crêtes des massifs provençaux sont autant de repères dans le paysage que de témoignages de la foi populaire. Érigées près d’un village, au terme d’un chemin ou sur un point culminant, elles pouvaient commémorer une mission religieuse, protéger symboliquement le territoire ou rappeler un événement. Certaines sont anciennes, d’autres ont remplacé des croix disparues.","photo":"photos/omimg_20260913_101201.jpg","photoExternal":null,"audio":null,"video":null,"youtube":null},{"name":"Abri du Figuier","lat":43.344755,"lon":5.661093300000001,"alt":375.47,"comment":"Près de la glacière et du site des Encanaux, au cœur du massif de la Sainte-Baume (sur la commune d'Auriol), se trouve l'Abri du Figuier (parfois associé aux reliefs et falaises environnants).\n\nIl s'agit d'une cavité naturelle remarquable (une « baume », c'est-à-dire un abri sous roche ou une grotte peu profonde creusée dans le calcaire) très appréciée des randonneurs. Facilement accessible et visitable sans danger depuis les sentiers balisés du secteur, l'abri constitue l'une des étapes incontournables des circuits de découverte du ravin.","photo":"photos/omimg_20260913_101338.jpg","photoExternal":null,"audio":null,"video":null,"youtube":null},{"name":"Abri du Figuier 2","lat":43.3448667,"lon":5.6611083,"alt":372.76,"comment":"L’abri du Figuier, près des Encanaux, est un petit refuge rustique aménagé dans ce paysage de garrigue et de pinèdes. Comme beaucoup d’abris pastoraux de Provence, il rappelle une époque où les collines étaient davantage parcourues par les troupeaux et exploitées pour le bois, le charbon ou la collecte de ressources. Sa présence témoigne de cette occupation discrète de la montagne : un lieu simple, destiné à offrir un peu de protection aux bergers et aux randonneurs face au soleil, au vent ou aux intempéries.","photo":"photos/omimg_20260913_101425.jpg","photoExternal":null,"audio":null,"video":null,"youtube":null},{"name":"Calvaire","lat":43.34487,"lon":5.6610417,"alt":377.56,"comment":"Érigée au début du mois d'octobre 2025, cette grande croix en bois a été installée sur un promontoire rocheux dominant le secteur, juste au-dessus de l'Abri du Figuier et du ravin des Encanaux (sur les hauteurs d'Auriol dans le massif de la Sainte-Baume).  Contexte de mise en place : Sa pose s'inscrit dans le cadre d'initiatives locales visant à restaurer ou jalonner certains repères patrimoniaux et paysagers des collines provençales. Elle est rapidement devenue un repère visuel notable pour les randonneurs arpentant les sentiers menant vers les grottes des Infernets, des Morts .","photo":"photos/omimg_20260913_101541.jpg","photoExternal":null,"audio":null,"video":null,"youtube":null},{"name":"Grotte des Infernets 1","lat":43.3438033,"lon":5.660515,"alt":353.37,"comment":"La grotte des Infernets s’ouvre au-dessus du ravin des Infernets, près des Encanaux, dans les calcaires de la Sainte-Baume. Sa galerie, longue d’une centaine de mètres, se prolonge par des passages de plus en plus étroits jusqu’à une petite salle ornée de concrétions. Redécouverte à la fin du XIXᵉ siècle, elle a livré des traces d’occupation humaine, notamment des vestiges néolithiques. La cavité sert aussi de refuge à des chauves-souris, dont le Minioptère de Schreibers.","photo":"photos/omimg_20260913_102436.jpg","photoExternal":null,"audio":null,"video":null,"youtube":null},{"name":"Concrétions","lat":43.3438033,"lon":5.660515,"alt":353.37,"comment":"Le long de cette fissure, la roche révèle le patient travail de l’eau souterraine. En s’infiltrant dans les fractures du calcaire, l’eau se charge en bicarbonate de calcium, puis abandonne progressivement une partie de ce carbonate lors de son dégazage. La calcite cristallise alors sur les parois et tapisse la fissure de petites concrétions blanches. Leur disposition souligne le cheminement ancien de l’eau et transforme une simple fracture tectonique en véritable micro-paysage minéral.","photo":"photos/omimg_20260913_102639.jpg","photoExternal":null,"audio":null,"video":null,"youtube":null},{"name":"Pistachier","lat":43.3439017,"lon":5.660545,"alt":344.97,"comment":"Le pistachier térébinthe (Pistacia terebinthus) se reconnaît ici à ses grappes de petits fruits rougeâtres, puis brunâtres à maturité. Ces drupes, très décoratives, contrastent avec le feuillage vert sombre de l’arbuste. Leur couleur attire les oiseaux qui participent à leur dissémination. En Provence, le térébinthe est un hôte caractéristique des garrigues et des bois clairs. Certaines galles, provoquées par de petits insectes, prennent par ailleurs l’aspect de curieuses cornes ou de petites excroissances végétales.","photo":"photos/omimg_20260913_102726.jpg","photoExternal":null,"audio":null,"video":null,"youtube":null},{"name":"Barre calcaire","lat":43.341885,"lon":5.6606083,"alt":376.06,"comment":"La barre calcaire qui surmonte l’Abri du Figuier et la grotte des Infernets appartient au Valanginien, autour de 140–135 Ma. Ces calcaires massifs, fracturés et karstifiés, ont favorisé le creusement des nombreuses cavités du ravin des Infernets.","photo":"photos/omimg_20260913_103901.jpg","photoExternal":null,"audio":null,"video":null,"youtube":null},{"name":"Ravin des Infernets","lat":43.3393033,"lon":5.66257,"alt":413.95,"comment":"Le ravin est profondément encaissé entre les barres calcaires, boisé et longtemps parcouru par un ruisseau intermittent. Ses falaises, ses grottes et ses passages resserrés ont sans doute favorisé une dénomination évoquant un lieu « infernal » ou difficile d’accès. Le toponyme est anciennement bien implanté : les documents officiels distinguent déjà le ravin des Encanaux et celui des Infernets.","photo":"photos/omimg_20260913_105010.jpg","photoExternal":null,"audio":null,"video":null,"youtube":null},{"name":"Tête du Chien","lat":43.3393033,"lon":5.66257,"alt":413.95,"comment":"La dénomination est associée à ce relief dominant les ravins des Infernets et de la Coutronne.\n\nL’explication la plus vraisemblable est morphologique : le relief ou sa silhouette rocheuse devait évoquer, vu depuis un certain angle, une tête de chien. C’est un procédé très courant dans la toponymie des reliefs provençaux : Tête, Baou, Roc ou Dent décrivent souvent une forme remarquable du paysage.","photo":"photos/omimg_20260913_105020.jpg","photoExternal":null,"audio":null,"video":null,"youtube":null},{"name":"Lit de torrent","lat":43.3386317,"lon":5.662455,"alt":412.75,"comment":"les Infernets sont un ravin à écoulement temporaire, mais qui peut devenir très actif lors des fortes pluies, dans un contexte karstique. Les crues peuvent être brutales, avec un ruissellement concentré sur les dalles calcaires.","photo":"photos/omimg_20260913_105250.jpg","photoExternal":null,"audio":null,"video":null,"youtube":null},{"name":"Barre calcaire","lat":43.3368933,"lon":5.663641699999999,"alt":443.24,"comment":"Les calcaires qui forment les barres rocheuses appartiennent principalement au Jurassique supérieur, dans le flanc nord de l’anticlinal de la Lare. Les données géologiques du secteur indiquent en effet un ensemble de calcaires et calcaires dolomitiques du Jurassique supérieur, avec des terrains valanginiens plus récents à proximité.","photo":"photos/omimg_20260913_110335.jpg","photoExternal":null,"audio":null,"video":null,"youtube":null},{"name":"Four à chaux ?","lat":43.3344967,"lon":5.667340000000001,"alt":487.2,"comment":"L’Association pour la Sauvegarde du Patrimoine Auriolais décrit une construction circulaire en pierre sèche, d’environ 10 m de diamètre, interprétée comme un ancien four à chaux destiné à transformer le calcaire en chaux vive. Le vestige aurait été dégagé de la végétation en 2007.","photo":"photos/omimg_20260913_111733.jpg","photoExternal":null,"audio":null,"video":null,"youtube":null},{"name":"Ravin","lat":43.3342033,"lon":5.6691917,"alt":513.33,"comment":"Ces profonds ravins sont essentiellement des formes quaternaires, façonnées par les eaux de ruissellement et la dissolution karstique dans un massif calcaire fortement fracturé. Leur creusement s'est probablement étalé sur plusieurs centaines de milliers d'années, tandis que les crues méditerranéennes continuent aujourd'hui de remodeler leurs fonds.","photo":"photos/omimg_20260913_112445.jpg","photoExternal":null,"audio":null,"video":null,"youtube":null},{"name":"Pancarte","lat":43.3332317,"lon":5.671276700000001,"alt":545.73,"comment":"Cette pancarte indique la direction du col de Roussargue, passage perché à environ 723 m entre les vallées d’Auriol et de Gémenos. Depuis les Encanaux, le sentier gagne progressivement les hauteurs en remontant notamment vers le secteur de la Coutronne. Le col constitue un véritable seuil topographique entre les deux versants du massif de la Sainte-Baume.","photo":"photos/omimg_20260913_113115.jpg","photoExternal":null,"audio":null,"video":null,"youtube":null},{"name":"Eau ?","lat":43.33322,"lon":5.67134,"alt":544.63,"comment":"Le marquage bleu (cercle et trait) : Il s'agit le plus souvent d'un balisage thématique local, d'un sentier d'interprétation, d'une variante d'itinéraire ou d'une trace spécifique (comme un chemin d'accès à un site d'escalade, une source ou une curiosité géologique particulière du secteur).","photo":"photos/omimg_20260913_113203.jpg","photoExternal":null,"audio":null,"video":null,"youtube":null},{"name":"Barre calcaire","lat":43.3315217,"lon":5.6758267,"alt":605.02,"comment":"Situé à l'extrémité ouest de la chaîne de la Sainte-Baume (au-dessus du col de l'Espigoulier et au nord du pic de Bertagne), le Plan des Vaches culmine à environ 875–900 mètres d'altitude.","photo":"photos/omimg_20260913_115317.jpg","photoExternal":null,"audio":null,"video":null,"youtube":null},{"name":"Pierres directrices","lat":43.331805,"lon":5.6763267,"alt":612.44,"comment":"Ce marquage ou ce balisage  au sol sur des pierres n'est pas très officiel.","photo":"photos/omimg_20260913_115502.jpg","photoExternal":null,"audio":null,"video":null,"youtube":null},{"name":"Rocher","lat":43.3324167,"lon":5.6783617,"alt":598.43,"comment":"Le secteur est une succession de crêtes et de ressauts calcaires appartenant à l'ensemble structural de la Sainte-Baume. Les cartes et les itinéraires donnent des noms aux éléments les plus remarquables — Tour de Cauvin, Dents de Roque Forcade, Pic des Corbeaux, etc. — mais plusieurs éminences intermédiaires restent anonymes. Les données spéléologiques localisent d'ailleurs le Plan des Vaches vers 860 m, avec le gouffre du Plan des Vaches à cette altitude.","photo":"photos/omimg_20260913_115827.jpg","photoExternal":null,"audio":null,"video":null,"youtube":null},{"name":"Sarriette en fleurs","lat":43.3327283,"lon":5.6795933,"alt":591.72,"comment":"La sarriette des montagnes (Satureja montana) est une petite plante aromatique typique des rocailles calcaires et des garrigues provençales. En été, ses fleurs blanches à rosées attirent abeilles et autres insectes pollinisateurs, tandis que ses feuilles dégagent, lorsqu’on les froisse, un parfum puissant, poivré et légèrement camphré. Les Anciens l’appréciaient déjà comme plante condimentaire et médicinale. Son nom latin évoque d’ailleurs les Satyres, auxquels la tradition prêtait des vertus aphrodisiaques à cette plante très odorante.","photo":"photos/omimg_20260913_120447.jpg","photoExternal":null,"audio":null,"video":null,"youtube":null},{"name":"Sarriette en fleurs","lat":43.33273,"lon":5.67958,"alt":589.62,"comment":"Un feu d'artifice floral tardif : Contrairement à de nombreuses aromatiques qui fleurissent au printemps, la sarriette s'épanouit tardivement en plein cœur de l'été et jusqu'en octobre. Elle se couvre alors d'une multitude de petites fleurs délicates, majoritairement blanches, parfois nuancées de rose pâle ou de mauve.","photo":"photos/omimg_20260913_120517.jpg","photoExternal":null,"audio":null,"video":null,"youtube":null},{"name":"Rocher 840","lat":43.3326,"lon":5.6813,"alt":586.62,"comment":"Extrémité nord du Plan des Vaches. Rocher à l'altitude 840 mètres.","photo":"photos/omimg_20260913_120832.jpg","photoExternal":null,"audio":null,"video":null,"youtube":null},{"name":"Tour Cauvin","lat":43.3326933,"lon":5.6817517,"alt":592.02,"comment":"Culminant à 828 mètres d'altitude dans le massif de la Sainte-Baume, la Tour Cauvin est un impressionnant monolithe calcaire de forme cylindrique s'élevant à l'extrémité d'un petit plateau.\n\nOrigine du nom : Le terme cauvin dérive du provençal signifiant « chauve », en référence à l'aspect totalement dépouillé et minéral de ce rocher qui émerge nettement de la végétation.\n\nParticularité géologique : Façonné par des millénaires d'érosion karstique, ce rocher circulaire d'une vingtaine de mètres de haut constitue un repère paysager remarquable et un site prisé des randonneurs pour son panorama é","photo":"photos/omimg_20260913_121050.jpg","photoExternal":null,"audio":null,"video":null,"youtube":null},{"name":"Colchique","lat":43.333655,"lon":5.683788299999999,"alt":605.32,"comment":"Le colchique d’automne (Colchicum autumnale) est une plante singulière : sa fleur apparaît en septembre ou octobre, alors que ses feuilles ne se développent qu’au printemps suivant. Il fleurit donc sans feuillage ! Cette stratégie lui a valu le surnom de « veilleuse des prés ». Autre particularité remarquable : toutes ses parties contiennent de la colchicine, substance extrêmement toxique, mais aussi utilisée en médecine, notamment dans le traitement de la goutte. Sa beauté automnale mérite donc qu’on l’admire… sans le cueillir.","photo":"photos/omimg_20260913_121447.jpg","photoExternal":null,"audio":null,"video":null,"youtube":null},{"name":"Ravin de la Coutronne","lat":43.33486,"lon":5.686133299999999,"alt":614.22,"comment":"Creusé dans le calcaire du massif de la Sainte-Baume, le ravin de la Coutronne se distingue par ses sentiers en corniche dominant des parois abruptes aux allures de mini-gorges. Il abrite de nombreux vestiges d'anciennes charbonnières (notamment des fours de type « appareils Moreau » datant de la fin du XIXe siècle), témoins de l'activité forestière passée. Ses chemins spectaculaires relient des points clés comme le Col de la Lare et le Plan des Vache","photo":"photos/omimg_20260913_130447.jpg","photoExternal":null,"audio":null,"video":null,"youtube":null},{"name":"Asphodèle sèche","lat":43.33655,"lon":5.690495,"alt":615.28,"comment":"Un bouquet d’asphodèles sèches conserve longtemps l’allure d’un petit bouquet fantomatique. Après la floraison printanière, les tiges de l’asphodèle se dessèchent et portent encore leurs capsules rondes, comme de petites perles brunes. Dans les garrigues provençales, ces hampes peuvent rester dressées plusieurs mois et ponctuer le paysage bien après la disparition des fleurs. L’asphodèle est aussi une plante chargée de mythologie : chez les Grecs, les prairies d’asphodèles étaient associées au royaume des morts, où séjournaient les âmes des défunts.","photo":"photos/omimg_20260913_133930.jpg","photoExternal":null,"audio":null,"video":null,"youtube":null},{"name":"Tour Cauvin et Pic de Bertagne","lat":43.337245,"lon":5.692278299999999,"alt":619.72,"comment":"Au sommet du Pic de Bertagne, à 1 043 m, le paysage naturel côtoie un ensemble impressionnant d’installations techniques. La grande coupole blanche abrite un radar destiné à la surveillance du trafic aérien. À proximité se dressent plusieurs antennes, pylônes et équipements de télécommunication, liés notamment aux réseaux radioélectriques de l’État. Ces constructions, peu communes sur un sommet provençal, constituent un repère très visible depuis les massifs environnants et contrastent fortement avec les falaises calcaires de la Sainte-Baume.","photo":"photos/omimg_20260913_134407.jpg","photoExternal":null,"audio":null,"video":null,"youtube":null},{"name":"Cèdres","lat":43.338135,"lon":5.6940467,"alt":629.2,"comment":"Les cèdres de la Sainte-Baume ne sont pas une essence spontanée du massif : le cèdre de l’Atlas (Cedrus atlantica) y a été introduit par l’homme, notamment à partir du XIXᵉ siècle. Il s’est bien adapté aux sols calcaires et au climat méditerranéen montagnard. Reconnaissable à son port majestueux, ses aiguilles regroupées en rosettes et ses cônes dressés, il supporte remarquablement la sécheresse. Certains peuplements constituent aujourd’hui de véritables forêts, témoignant de l’adaptation réussie d’une essence venue des montagnes d’Afrique du Nord.","photo":"photos/omimg_20260913_134704.jpg","photoExternal":null,"audio":null,"video":null,"youtube":null},{"name":"Roche éclatée","lat":43.3409383,"lon":5.6974817,"alt":670.23,"comment":"Une diaclase constitue une zone de faiblesse dans une roche. L’eau peut y pénétrer, dissoudre progressivement le calcaire et élargir la fissure. En hiver, le gel augmente encore cette ouverture par l’expansion de l’eau. Les contraintes tectoniques ou la décompression peuvent également favoriser son extension. Peu à peu, la diaclase devient une véritable surface de rupture : des blocs se détachent alors de la falaise. Ce mécanisme contribue activement au recul des barres calcaires et à l’évolution des reliefs de la Sainte-Baume.","photo":"photos/omimg_20260913_140651.jpg","photoExternal":null,"audio":null,"video":null,"youtube":null},{"name":"Falaise rive gauche","lat":43.33703,"lon":5.689025,"alt":586.43,"comment":"La falaise de la rive gauche de la Coutronne est constituée de puissants calcaires du Jurassique supérieur, probablement portlandiens, déposés il y a environ 150 millions d’années. Ces bancs, aujourd’hui fortement fracturés et karstifiés, ont été dégagés par l’érosion du vallon.","photo":"photos/omimg_20260913_142636.jpg","photoExternal":null,"audio":null,"video":null,"youtube":null},{"name":"Fond du ravin","lat":43.33646,"lon":5.6884317,"alt":546.72,"comment":"Le lit de la Coutronne est souvent à sec, mais cela ne signifie pas que l’eau est absente du massif. Dans ces calcaires fortement fissurés et karstifiés, une grande partie des précipitations s’infiltre rapidement par les diaclases et rejoint un réseau souterrain. Le ravin ne fonctionne donc que temporairement, surtout après les épisodes pluvieux. Lors des fortes pluies, les eaux peuvent au contraire s’y concentrer brutalement et transformer ce lit paisible en torrent. Une grande partie de l’eau circule ainsi sous nos pieds.","photo":"photos/omimg_20260913_143436.jpg","photoExternal":null,"audio":null,"video":null,"youtube":null},{"name":"Sainte Victoire","lat":43.336575,"lon":5.6736783,"alt":456.3299999999999,"comment":"La Sainte-Victoire apparaît au nord, au-delà du Regagnas. Sa longue silhouette calcaire se détache nettement de l’horizon, reconnaissable à sa grande barre rocheuse et, lorsque la visibilité est bonne, à la croix de Provence. Entre les deux massifs s’intercalent les reliefs plus modestes du Regagnas et du Mont Olympe. Ce panorama illustre parfaitement l’organisation des grands massifs calcaires de Provence, séparés par les plaines et les vallées qui structurent le paysage.","photo":"photos/omimg_20260913_152034.jpg","photoExternal":null,"audio":null,"video":null,"youtube":null},{"name":"Ravin de la Coutronne","lat":43.3369133,"lon":5.673695,"alt":437.43,"comment":"Le toponyme Coutronne est ancien, et il ne s’agit manifestement pas d’une appellation récente donnée au ravin par les randonneurs. Le nom désigne notamment une ferme, aujourd’hui toujours localisée à Auriol, ainsi que le ravin et plusieurs cavités du secteur. Les sources spéléologiques utilisent déjà « ferme de la Coutronne » dans le contexte des explorations de 1952.","photo":"photos/omimg_20260913_152416.jpg","photoExternal":null,"audio":null,"video":null,"youtube":null},{"name":"Flaques","lat":43.3380467,"lon":5.67124,"alt":355.34,"comment":"Les chaînes visibles dans le ravin de la Coutronne sont très probablement liées à l’équipement du canyon. Le ravin comporte plusieurs ressauts rocheux et cascades, dont certains passages nécessitent des mains courantes ou des points d’ancrage pour être franchis. Ces chaînes permettent de sécuriser la progression et peuvent servir à installer une corde lors des descentes. Le canyon étant généralement sec, ces équipements sont surtout utilisés lors des parcours de canyonisme, notamment après les épisodes pluvieux lorsque les cascades et vasques peuvent se remplir.","photo":"photos/omimg_20260913_153716.jpg","photoExternal":null,"audio":null,"video":null,"youtube":null},{"name":"Fissure aquifère","lat":43.344095,"lon":5.668240000000001,"alt":274.16,"comment":"La source inférieure des Encanaux est pérenne : elle présente un débit relativement peu variable et constitue une émergence karstique permanente. Une étude hydrogéologique récente confirme que cette résurgence émerge des dolomies portlandiennes « de manière pérenne ».\n\nPlus haut dans le vallon, en revanche, les sources supérieures et certaines résurgences sont temporaires et ne fonctionnent qu'en période de crue.","photo":"photos/omimg_20260913_160447.jpg","photoExternal":null,"audio":null,"video":null,"youtube":null},{"name":"Autres sources","lat":43.3441967,"lon":5.66813,"alt":274.46,"comment":"le ruisseau des Encanaux peut conserver de l’eau toute l’année grâce à la source pérenne, alors que les ravins et les écoulements en amont peuvent être complètement secs. La Vède, alimentée par ces sources, est d’ailleurs considérée comme l’un des rares affluents de l’Huveaune à être en eau toute l’année.","photo":"photos/omimg_20260913_160646.jpg","photoExternal":null,"audio":null,"video":null,"youtube":null},{"name":"Rocher","lat":43.345755,"lon":5.66627,"alt":263.26,"comment":"Les calcaires, très fracturés et parcourus de diaclases, se découpent en panneaux et en blocs. L’infiltration de l’eau élargit les fractures par dissolution, tandis que l’alternance humidification-dessiccation, les variations thermiques et l’action des racines favorisent leur détachement. Les fortes pluies peuvent ensuite provoquer des chutes de blocs et entraîner les matériaux vers le fond du ravin. Le risque de chutes de pierres et de blocs est d’ailleurs particulièrement identifié dans les secteurs des Encanaux et des Infernets.","photo":"photos/omimg_20260913_161230.jpg","photoExternal":null,"audio":null,"video":null,"youtube":null},{"name":"Pont des Encanaux","lat":43.3465117,"lon":5.665925,"alt":268.82,"comment":"L'accès en voiture au Pont des Encanaux, situé dans le vallon sur la commune d'Auriol, est interdit aux véhicules du grand public afin de préserver l'environnement et de prévenir les incendies. Les pistes et voies menant au vallon sont fermées à la circulation automobile.\n\nStationnement : Il est obligatoire de garer son véhicule sur les aires de stationnement situées en aval, notamment le long de la RD45.\n\nAccès : La fin du trajet s'effectue exclusivement à pied en empruntant les sentiers balisés et la piste forestière.","photo":"photos/omimg_20260913_161402.jpg","photoExternal":null,"audio":null,"video":null,"youtube":null},{"name":"Pont des Encanaux 2","lat":43.346565,"lon":5.6658767,"alt":262.97,"comment":"Sous le Pont des Encanaux coule une eau qui ne disparaît pas avec la sécheresse estivale. Le ruisseau est alimenté par plusieurs sources karstiques issues des calcaires et dolomies de la Sainte-Baume. Certaines émergences sont temporaires, mais les principales résurgences des Encanaux sont pérennes. Leur débit, relativement régulier en période normale, peut toutefois augmenter brutalement après les pluies : le calme ruisseau devient alors un torrent.","photo":"photos/omimg_20260913_161542.jpg","photoExternal":null,"audio":null,"video":null,"youtube":null},{"name":"Rivière des Encanaux","lat":43.3487908,"lon":5.6633449,"alt":0,"comment":"Sous le Pont des Encanaux, le cours d’eau est appelé ruisseau des Encanaux. Il ne faut donc pas l’appeler la Vède à cet endroit.\n\nLe système est le suivant :\n\nruisseau des Encanaux + ruisseau des Infernets + ruisseau de Daurengue → Vède → Huveaune.\n\nLe ruisseau des Encanaux rejoint les autres écoulements vers le secteur du parking des Encanaux, où se forme la Vède. Une source géologique décrit explicitement les trois ruisseaux et leur réunion pour former la Vède.","photo":"photos/omimg_20260913_162250.jpg","photoExternal":null,"audio":null,"video":null,"youtube":null},{"name":"Arrivée","lat":43.3506133,"lon":5.6602117,"alt":243.45,"comment":"Grande randonnée\n\nHeure de départ: 09:08 13 sept. 2026\nHeure d'arrivée: 16:27 13 sept. 2026\nDistance: 11,5km (07:19)\nTemps déplacement: 04:10\nVitesse moyenne: 1,57 km/h\nVitesse en mouvement: 2,75 km/h\nVitesse Max.: 14,03 km/h\nAltitude minimale: 241 m\nAltitude maximale: 669 m\nVitesse de montée: 190,7 m/h\nVitesse de descente: 119,3 m/h\nDénivelé positif: 523 m\nDénivelé négatif: 528 m\nTemps de montée: 02:44\nTemps de descente: 04:25","photo":null,"photoExternal":null,"audio":null,"video":null,"youtube":null}];
