e plantes dicotylédones de la famille des Fabaceae, sous-famille des Faboideae, originaire du bassin méditerranéen. Ce sont des plantes ligneuses vivaces, semi-halophiles.","photo":null,"photoExternal":"https://live.staticflickr.com/65535/51245010653_0f03a8252c_b.jpg","audio":null,"video":null,"youtube":null},{"name":"Cap Camarat","lat":43.176227,"lon":6.640137,"alt":0,"comment":"","photo":null,"photoExternal":"https://live.staticflickr.com/65535/51245554704_129f8ca419_b.jpg","audio":null,"video":null,"youtube":null},{"name":"Cap Lardier 1","lat":43.160076,"lon":6.619916,"alt":0,"comment":"Le cap Lardier est le premier des trois caps de la presqu’île de Saint-Tropez visible depuis la baie de Cavalaire, et le plus boisé. Situé sur la commune de La Croix Valmer, dans le Var, c’est l’un des derniers poumons verts encore non urbanisés compris entre les villes balnéaires très touristiques de Cavalaire et de Saint-Tropez.","photo":null,"photoExternal":"https://live.staticflickr.com/65535/51245012783_51ea549619_b.jpg","audio":null,"video":null,"youtube":null},{"name":"Cap Lardier Est","lat":43.160618,"lon":6.620949,"alt":0,"comment":"","photo":null,"photoExternal":"https://live.staticflickr.com/65535/51245008778_60988d6379_b.jpg","audio":null,"video":null,"youtube":null},{"name":"Cap Taillat Est","lat":43.176224,"lon":6.640122,"alt":0,"comment":"","photo":null,"photoExternal":"https://live.staticflickr.com/65535/51245848355_aec9d949b1_b.jpg","audio":null,"video":null,"youtube":null},{"name":"Cavalaire","lat":43.179126,"lon":6.60294,"alt":0,"comment":"","photo":null,"photoExternal":"https://live.staticflickr.com/65535/51245896890_25f3e755db_b.jpg","audio":null,"video":null,"youtube":null},{"name":"Chenille Cucullie Scrof.","lat":43.165104,"lon":6.618056,"alt":0,"comment":"La Cucullie de la scrofulaire ou Cucullie des scrofulaires (Shargacucullia scrophulariae ou Cucullia scrophulariae) est une espèce de lépidoptères (papillons) de la famille des Noctuidae et de la sous-famille des Cuculliinae. Comme me l'a fait remarquer Vincent Blondel, cette cucullie pourrait aussi bien être la cucullie du Bouillon-Blanc.","photo":null,"photoExternal":"https://live.staticflickr.com/65535/51244845091_0833860bbf_b.jpg","audio":null,"video":null,"youtube":null},{"name":"Citerne des Gaches","lat":43.188668,"lon":6.614888,"alt":0,"comment":"","photo":null,"photoExternal":"https://live.staticflickr.com/65535/51244781421_d74d7605cc_b.jpg","audio":null,"video":null,"youtube":null},{"name":"Départ","lat":43.185682,"lon":6.599128,"alt":0,"comment":"","photo":null,"photoExternal":null,"audio":null,"video":null,"youtube":null},{"name":"Dolmen de la Briande","lat":43.177974,"lon":6.634818,"alt":0,"comment":"Le dolmen a été édifié à flanc de coteau, à 300 m de la mer, c'est d'ailleurs le dolmen le plus méridional de tout le département. Bien que très endommagée, l'architecture générale de l'édifice est reconnaissable. La chambre sépulcrale est de forme rectangulaire. Elle est délimitée par une dalle de chevet et un orthostate côté est, tous deux en granite d'origine locale. Les autres dalles sont en gneiss, dressées sur chant et jointes par des murettes en pierres sèches.","photo":null,"photoExternal":"https://live.staticflickr.com/65535/51245846865_283162c208_b.jpg","audio":null,"video":null,"youtube":null},{"name":"Forêt de La Tourraque","lat":43.185922,"lon":6.629141,"alt":0,"comment":"","photo":null,"photoExternal":"https://live.staticflickr.com/65535/51245842990_a795827b1a_b.jpg","audio":null,"video":null,"youtube":null},{"name":"Gigaro 2","lat":43.18163,"lon":6.602381,"alt":0,"comment":"","photo":null,"photoExternal":"https://live.staticflickr.com/65535/51245604259_d62124d689_b.jpg","audio":null,"video":null,"youtube":null},{"name":"Gigaro 3","lat":43.17856,"lon":6.603428,"alt":0,"comment":"","photo":null,"photoExternal":"https://live.staticflickr.com/65535/51245600339_b2cf3344a7_b.jpg","audio":null,"video":null,"youtube":null},{"name":"Gigaro 4","lat":43.176985,"lon":6.603626,"alt":0,"comment":"","photo":null,"photoExternal":"https://live.staticflickr.com/65535/51245893360_5d1b2c52b9_b.jpg","audio":null,"video":null,"youtube":null},{"name":"Giroflée des dunes","lat":43.172747,"lon":6.639172,"alt":0,"comment":"","photo":null,"photoExternal":"https://live.staticflickr.com/65535/51244996508_38d165d2d6_b.jpg","audio":null,"video":null,"youtube":null},{"name":"Jeune palmier (Phoenix probable)","lat":43.187526,"lon":6.628518,"alt":0,"comment":"Ce jeune palmier poussant dans une dépression humide n'est pas le palmier nain (Chamaerops) comme je l'avais rapidement décrit, mais comme me l'a fait remarquer Marjorie Ughetto plutôt un Phoenix, avec la palme en forme de plume.","photo":null,"photoExternal":"https://live.staticflickr.com/65535/51244073557_883b0d598e_b.jpg","audio":null,"video":null,"youtube":null},{"name":"Jonc","lat":43.165957,"lon":6.623889,"alt":0,"comment":"","photo":null,"photoExternal":"https://live.staticflickr.com/65535/51244803661_14e28d18a8_b.jpg","audio":null,"video":null,"youtube":null},{"name":"Jovat 1","lat":43.176507,"lon":6.604506,"alt":0,"comment":"","photo":null,"photoExternal":"https://live.staticflickr.com/65535/51244831566_bff9b17084_b.jpg","audio":null,"video":null,"youtube":null},{"name":"Joyat 2","lat":43.174811,"lon":6.603267,"alt":0,"comment":"","photo":null,"photoExternal":"https://live.staticflickr.com/65535/51245888275_35e9703d24_b.jpg","audio":null,"video":null,"youtube":null},{"name":"Lardier 1","lat":43.173882,"lon":6.604491,"alt":0,"comment":"","photo":null,"photoExternal":"https://live.staticflickr.com/65535/51244118777_99a2e98fac_b.jpg","audio":null,"video":null,"youtube":null},{"name":"Lardier Est 2","lat":43.165904,"lon":6.623887,"alt":0,"comment":"","photo":null,"photoExternal":"https://live.staticflickr.com/65535/51245864155_c2af406fd0_b.jpg","audio":null,"video":null,"youtube":null},{"name":"Lardier Plage","lat":43.162994,"lon":6.621331,"alt":0,"comment":"","photo":null,"photoExternal":"https://live.staticflickr.com/65535/51245572309_ce4fa56cae_b.jpg","audio":null,"video":null,"youtube":null},{"name":"Lavatère","lat":43.162192,"lon":6.619469,"alt":0,"comment":"La Mauve ou lavatère royale (Malva arborea ou Malva dendromorpha) est un arbrisseau poussant sur le littoral méditerranéen et sur les côtes atlantiques, dont les grandes fleurs pourpres ou violacées sont assez semblables à celles des mauves véritables, même si leur coloris est souvent plus vif.","photo":null,"photoExternal":"https://live.staticflickr.com/65535/51244107822_f7e0fd863d_b.jpg","audio":null,"video":null,"youtube":null},{"name":"Lepture porte-coeur sur figuier Barbarie","lat":43.176735,"lon":6.636482,"alt":0,"comment":"","photo":null,"photoExternal":"https://live.staticflickr.com/65535/51245902005_2134cdd5d0_b.jpg","audio":null,"video":null,"youtube":null},{"name":"Myrte commun","lat":43.160768,"lon":6.621546,"alt":0,"comment":"Le Myrte commun, parfois appelé Myrte juif ou Herbe du lagui (Myrtus communis), est une espèce d'arbuste buissonnant au port dressé. Les feuilles de 2 à 5 cm de long, opposées, ovales, vernissées, de couleur vert foncé, aromatiques quand on les froisse. Les fleurs solitaires à long pédicelle et à cinq pétales, avec une touffe centrale d'étamines blanches, dégagent un parfum capiteux. Les fleurs ont un diamètre de 1 à 2 cm. La floraison a lieu de juin à octobre.","photo":null,"photoExternal":"https://live.staticflickr.com/65535/51244135667_18db9ca847_b.jpg","audio":null,"video":null,"youtube":null},{"name":"Oeillet des Rochers","lat":43.180467,"lon":6.603157,"alt":0,"comment":"","photo":null,"photoExternal":"https://live.staticflickr.com/65535/51245904855_43634de9b0_b.jpg","audio":null,"video":null,"youtube":null},{"name":"Pancarte 1","lat":43.183688,"lon":6.600632,"alt":0,"comment":"","photo":null,"photoExternal":"https://live.staticflickr.com/65535/51245606869_536389c4e7_b.jpg","audio":null,"video":null,"youtube":null},{"name":"Pancarte 2","lat" r.com/65535/51245021393_5d00ca312f_b.jpg","audio":null,"video":null,"youtube":null},{"name":"Roc tombolo de Taillat","lat":43.173808,"lon":6.637201,"alt":0,"comment":"Le cap Taillat, aussi appelé cap Cartaya est un cap situé au sud de la presqu'île de Saint-Tropez. Il marque la limite entre les communes de Ramatuelle et de la Croix-Valmer. Il a la particularité d’être relié à la cote par un isthme sableux (un tombolo). Le cap Taillat est un site classé et inscrit.","photo":null,"photoExternal":"https://live.staticflickr.com/65535/51244997678_5473800dec_b.jpg","audio":null,"video":null,"youtube":null},{"name":"Taillat ouest","lat":43.16725,"lon":6.626293,"alt":0,"comment":"","photo":null,"photoExternal":"https://live.staticflickr.com/65535/51245565789_fc0ed50045_b.jpg","audio":null,"video":null,"youtube":null},{"name":"Vers Lardier 1","lat":43.167614,"lon":6.614842,"alt":0,"comment":"","photo":null,"photoExternal":"https://live.staticflickr.com/65535/51244822041_91d6a2f0cb_b.jpg","audio":null,"video":null,"youtube":null}];
