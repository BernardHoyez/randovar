com/65535/51245848355_aec9d949b1_b.jpg}} [[https://live.staticflickr.com/65535/51245848355_aec9d949b1_b.jpg|Agrandir]]","photo":null,"audio":null,"video":null,"youtube":null},{"name":"Cavalaire","lat":43.179126,"lon":6.60294,"alt":0,"comment":"{{https://live.staticflickr.com/65535/51245896890_25f3e755db_b.jpg}} [[https://live.staticflickr.com/65535/51245896890_25f3e755db_b.jpg|Agrandir]]","photo":null,"audio":null,"video":null,"youtube":null},{"name":"Chenille Cucullie Scrof.","lat":43.165104,"lon":6.618056,"alt":0,"comment":"{{https://live.staticflickr.com/65535/51244845091_0833860bbf_b.jpg}} [[https://live.staticflickr.com/65535/51244845091_0833860bbf_b.jpg|Agrandir]] La Cucullie de la scrofulaire ou Cucullie des scrofulaires (Shargacucullia scrophulariae ou Cucullia scrophulariae) est une espèce de lépidoptères (papillons) de la famille des Noctuidae et de la sous-famille des Cuculliinae. Comme me l'a fait remarquer Vincent Blondel, cette cucullie pourrait aussi bien être la cucullie du Bouillon-Blanc.","photo":null,"audio":null,"video":null,"youtube":null},{"name":"Citerne des Gaches","lat":43.188668,"lon":6.614888,"alt":0,"comment":"{{https://live.staticflickr.com/65535/51244781421_d74d7605cc_b.jpg}} [[https://live.staticflickr.com/65535/51244781421_d74d7605cc_b.jpg|Agrandir]]","photo":null,"audio":null,"video":null,"youtube":null},{"name":"Départ","lat":43.185682,"lon":6.599128,"alt":0,"comment":"","photo":null,"audio":null,"video":null,"youtube":null},{"name":"Dolmen de la Briande","lat":43.177974,"lon":6.634818,"alt":0,"comment":"{{https://live.staticflickr.com/65535/51245846865_283162c208_b.jpg}} [[https://live.staticflickr.com/65535/51245846865_283162c208_b.jpg|Agrandir]] Le dolmen a été édifié à flanc de coteau, à 300 m de la mer, c'est d'ailleurs le dolmen le plus méridional de tout le département. Bien que très endommagée, l'architecture générale de l'édifice est reconnaissable. La chambre sépulcrale est de forme rectangulaire. Elle est délimitée par une dalle de chevet et un orthostate côté est, tous deux en granite d'origine locale. Les autres dalles sont en gneiss, dressées sur chant et jointes par des murettes en pierres sèches.","photo":null,"audio":null,"video":null,"youtube":null},{"name":"Forêt de La Tourraque","lat":43.185922,"lon":6.629141,"alt":0,"comment":"{{https://live.staticflickr.com/65535/51245842990_a795827b1a_b.jpg}} [[https://live.staticflickr.com/65535/51245842990_a795827b1a_b.jpg|Agrandir]]","photo":null,"audio":null,"video":null,"youtube":null},{"name":"Gigaro 2","lat":43.18163,"lon":6.602381,"alt":0,"comment":"{{https://live.staticflickr.com/65535/51245604259_d62124d689_b.jpg}} [[https://live.staticflickr.com/65535/51245604259_d62124d689_b.jpg|agrandir]]","photo":null,"audio":null,"video":null,"youtube":null},{"name":"Gigaro 3","lat":43.17856,"lon":6.603428,"alt":0,"comment":"{{https://live.staticflickr.com/65535/51245600339_b2cf3344a7_b.jpg}} [[https://live.staticflickr.com/65535/51245600339_b2cf3344a7_b.jpg|Agrandir]]","photo":null,"audio":null,"video":null,"youtube":null},{"name":"Gigaro 4","lat":43.176985,"lon":6.603626,"alt":0,"comment":"{{https://live.staticflickr.com/65535/51245893360_5d1b2c52b9_b.jpg}} [[https://live.staticflickr.com/65535/51245893360_5d1b2c52b9_b.jpg|Agrandir]]","photo":null,"audio":null,"video":null,"youtube":null},{"name":"Giroflée des dunes","lat":43.172747,"lon":6.639172,"alt":0,"comment":"{{https://live.staticflickr.com/65535/51244996508_38d165d2d6_b.jpg}} [[https://live.staticflickr.com/65535/51244996508_38d165d2d6_b.jpg|Agrandir]]","photo":null,"audio":null,"video":null,"youtube":null},{"name":"Jeune palmier (Phoenix probable)","lat":43.187526,"lon":6.628518,"alt":0,"comment":"{{https://live.staticflickr.com/65535/51244073557_883b0d598e_b.jpg}} [[https://live.staticflickr.com/65535/51244073557_883b0d598e_b.jpg|Agrandir]] Ce jeune palmier poussant dans une dépression humide n'est pas le palmier nain (Chamaerops) comme je l'avais rapidement décrit, mais comme me l'a fait remarquer Marjorie Ughetto plutôt un Phoenix, avec la palme en forme de plume.","photo":null,"audio":null,"video":null,"youtube":null},{"name":"Jonc","lat":43.165957,"lon":6.623889,"alt":0,"comment":"{{https://live.staticflickr.com/65535/51244803661_14e28d18a8_b.jpg}} [[https://live.staticflickr.com/65535/51244803661_14e28d18a8_b.jpg|Agrandir]]","photo":null,"audio":null,"video":null,"youtube":null},{"name":"Jovat 1","lat":43.176507,"lon":6.604506,"alt":0,"comment":"{{https://live.staticflickr.com/65535/51244831566_bff9b17084_b.jpg}} [[https://live.staticflickr.com/65535/51244831566_bff9b17084_b.jpg|Agrandir]]","photo":null,"audio":null,"video":null,"youtube":null},{"name":"Joyat 2","lat":43.174811,"lon":6.603267,"alt":0,"comment":"{{https://live.staticflickr.com/65535/51245888275_35e9703d24_b.jpg}} [[https://live.staticflickr.com/65535/51245888275_35e9703d24_b.jpg|Agrandir]]","photo":null,"audio":null,"video":null,"youtube":null},{"name":"Lardier 1","lat":43.173882,"lon":6.604491,"alt":0,"comment":"{{https://live.staticflickr.com/65535/51244118777_99a2e98fac_b.jpg}} [[https://live.staticflickr.com/65535/51244118777_99a2e98fac_b.jpg|Agrandir]]","photo":null,"audio":null,"video":null,"youtube":null},{"name":"Lardier Est 2","lat":43.165904,"lon":6.623887,"alt":0,"comment":"{{https://live.staticflickr.com/65535/51245864155_c2af406fd0_b.jpg}} [[https://live.staticflickr.com/65535/51245864155_c2af406fd0_b.jpg|Agrandir]]","photo":null,"audio":null,"video":null,"youtube":null},{"name":"Lardier Plage","lat":43.162994,"lon":6.621331,"alt":0,"comment":"{{https://live.staticflickr.com/65535/51245572309_ce4fa56cae_b.jpg}} [[https://live.staticflickr.com/65535/51245572309_ce4fa56cae_b.jpg|Agrandir]]","photo":null,"audio":null,"video":null,"youtube":null},{"name":"Lavatère","lat":43.162192,"lon":6.619469,"alt":0,"comment":"{{https://live.staticflickr.com/65535/51244107822_f7e0fd863d_b.jpg}} [[https://live.staticflickr.com/65535/51244107822_f7e0fd863d_b.jpg|Agrandir]] La Mauve ou lavatère royale (Malva arborea ou Malva dendromorpha) est un arbrisseau poussant sur le littoral méditerranéen et sur les côtes atlantiques, dont les grandes fleurs pourpres ou violacées sont assez semblables à celles des mauves véritables, même si leur coloris est souvent plus vif.","photo":null,"audio":null,"video":null,"youtube":null},{"name":"Lepture porte-coeur sur figuier Barbarie","lat":43.176735,"lon":6.636482,"alt":0,"comment":"{{https://live.staticflickr.com/65535/51245902005_2134cdd5d0_b.jpg}} [[https://live.staticflickr.com/65535/51245902005_2134cdd5d0_b.jpg|Agrandir]] {{https://live.staticflickr.com/65535/51245901860_657a09478b_b.jpg}} [[https://live.staticflickr.com/65535/51245901860_657a09478b_b.jpg|Agrandir]]","photo":null,"audio":null,"video":null,"youtube":null},{"name":"Myrte commun","lat":43.160768,"lon":6.621546,"alt":0,"comment":"{{https://live.staticflickr.com/65535/51244135667_18db9ca847_b.jpg}} [[https://live.staticflickr.com/65535/51244135667_18db9ca847_b.jpg|Agrandir]] Le Myrte commun, parfois appelé Myrte juif ou Herbe du lagui (Myrtus communis), est une espèce d'arbuste buissonnant au port dressé. Les feuilles de 2 à 5 cm de long, opposées, ovales, vernissées, de couleur vert foncé, aromatiques quand on les froisse. Les fleurs solitaires à long pédicelle et à cinq pétales, avec une touffe centrale d'étamines blanches, dégagent un parfum capiteux. Les fleurs ont un diamètre de 1 à 2 cm. La floraison a lieu de juin à octobre.","photo":null,"audio":null,"video":null,"youtube":null},{"name":"Oeillet des Rochers","lat":43.180467,"lon":6.603157,"alt":0,"comment":"{{https://live.staticflickr.com/65535/51245904855_43634de9b0_b.jpg}} [[https://live.staticflickr.com/65535/51245904855_43634de9b0_b.jpg|agrandir]] {{https://live.staticflickr.com/65535/51245904700_bc4894dac6_b.jpg}} [[https://live.staticflickr.com/65535/51245904700_bc4894dac6_b.jpg|agrandir]] {{https://live.staticflickr.com/65535/51245904425_fbfe7f7ce2_b.jpg}} [[https://live.staticflickr.com/65535/51245904425_fbfe7f7ce2_b.jpg|agrandir]]","photo":null,"audio":null,"video":null,"youtube":null},{"name":"Pancarte 1","lat":43.183688,"lon":6.600632,"alt":0,"comment":"{{https://live.staticflickr.com/65535/51245606869_536389c4e7_b.jpg}} [[https://live.staticflickr.com/65535/51245606869_536389c4e7_b.jpg|agrandir]]","photo":null,"audio":null,"video":null,"youtube":null},{"name":"Pancarte 2","lat":43.176643,"lon":6.604329,"alt":0,"comment":"{{https://live.staticflickr.com/65535/51245596649_ebeb7b6f96_b.jpg}} [[https://live.staticflickr.com/65535/51245596649_ebeb7b6f96_b.jpg|Agrandir]]","photo":null,"audio":null,"video":null,"youtube":null},{"name":"Pancarte Maison Douaniers","lat":43.174976,"lon":6.639787,"alt":0,"comment":"{{https://live.staticflickr.com/65535/51245558519_4664069415_b.jpg}} [[https://live.staticflickr.com/65535/51245558519_4664069415_b.jpg|Agrandir]]","photo":null,"audio":null,"video":null,"youtube":null},{"name":"Parasols de La Bergerie","lat":43.18072,"lon":6.631919,"alt":0,"comment":"{{https://live.staticflickr.com/65535/51244076522_50aeaab7d1_b.jpg}} [[https://live.staticflickr.com/65535/51244076522_50aeaab7d1_b.jpg|Agrandir]]","photo":null,"audio":null,"video":null,"youtube":null},{"name":"Plage de Gigaro","lat":43.182127,"lon":6.60209,"alt":0,"comment":"{{https://live.staticflickr.com/65535/51244841476_2d2243865b_b.jpg}} [[https://live.staticflickr.com/65535/51244841476_2d2243865b_b.jpg|agrandir]] Cette plage familiale est la dernière avant l’accès au sentier des douaniers et est considérée comme la porte d’entrée du Conservatoire du Littoral.","photo":null,"audio":null,"video":null,"youtube":null},{"name":"Poteau Brouis","lat":43.172986,"lon":6.60842,"alt":0,"comment":"{{https://live.staticflickr.com/65535/51245588844_1966f3b471_b.jpg}} [[https://live.staticflickr.com/65535/51245588844_1966f3b471_b.jpg|Agrandir]]","photo":null,"audio":null,"video":null,"youtube":null},{"name":"Poteau Cap Taillat","lat":43.172955,"lon":6
