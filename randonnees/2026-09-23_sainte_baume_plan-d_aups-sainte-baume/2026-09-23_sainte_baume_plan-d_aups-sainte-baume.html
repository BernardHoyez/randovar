<script>
var wps=[{"name":"Départ","lat":43.3355133,"lon":5.7592483,"alt":663.05,"comment":"","photo":null,"photoExternal":null,"audio":null,"video":null,"youtube":null},{"name":"Falaise","lat":43.3355017,"lon":5.7592417,"alt":676.58,"comment":"La falaise de la Sainte-Baume résulte d’une longue histoire tectonique et érosive. Les calcaires jurassiques se sont déposés dans une mer chaude, puis ont été plissés et redressés lors des déformations qui ont affecté la Provence. La Sainte-Baume correspond à un grand relief structural, dont les couches calcaires résistantes ont mieux supporté l’érosion que les terrains plus tendres environnants. Au fil du temps, l’érosion différentielle, favorisée par les fractures et les plans de stratification, a dégagé et fait reculer la paroi. ","photo":"photos/omimg_20260923_100448.jpg","photoExternal":null,"audio":null,"video":null,"youtube":null},{"name":"Pancarte","lat":43.33343,"lon":5.758851699999999,"alt":675.13,"comment":"La forêt domaniale de la Sainte-Baume occupe le versant nord du massif, au pied de la célèbre falaise calcaire. Son climat particulier, plus frais et humide que celui des plaines provençales, permet le développement d’une forêt remarquable, où se côtoient hêtres, chênes, érables, ifs et houx. Cette hêtraie constitue une véritable anomalie biogéographique en Provence méditerranéenne. Protégée depuis des siècles, notamment en raison du caractère sacré du massif, elle a échappé à de nombreuses coupes et conserve aujourd’hui une grande richesse écologique.","photo":"photos/omimg_20260923_101350.jpg","photoExternal":null,"audio":null,"video":null,"youtube":null},{"name":"Pancarte","lat":43.3332917,"lon":5.758828300000001,"alt":672.56,"comment":"Le chemin du Canapé conduit à la grotte Sainte-Marie-Madeleine, nichée dans la falaise de la Sainte-Baume. Ce sentier ancien traverse la forêt avant de rejoindre progressivement le pied de la paroi calcaire. La grotte, vaste abri naturel aménagé en sanctuaire, est traditionnellement considérée comme le lieu où Marie-Madeleine aurait vécu en Provence après son arrivée en Gaule. Depuis le Moyen Âge, elle est devenue un important lieu de pèlerinage. L’itinéraire offre une approche spectaculaire de la falaise et permet de comprendre comment l’érosion a creusé les cavités dans le massif calcaire.","photo":"photos/omimg_20260923_101444.jpg","photoExternal":null,"audio":null,"video":null,"youtube":null},{"name":"Calade","lat":43.332165,"lon":5.7577333,"alt":685.85,"comment":"Les calades du chemin du Canapé témoignent des anciens aménagements des chemins de la Sainte-Baume. Ces passages sont pavés de pierres calcaires posées de chant ou à plat, selon une technique traditionnelle destinée à stabiliser les sentiers sur les pentes. Leur surface irrégulière offrait autrefois un meilleur appui aux marcheurs, aux mulets et aux animaux de bât. Aujourd’hui encore, certaines portions conservent leur pavement d’origine. Entre les racines et les affleurements rocheux, ces calades rappellent que le chemin du Canapé fut longtemps un itinéraire fréquenté par les pèlerins.","photo":"photos/omimg_20260923_101930.jpg","photoExternal":null,"audio":null,"video":null,"youtube":null},{"name":"Calade 2","lat":43.3314367,"lon":5.7582667,"alt":696.56,"comment":"Une calade est un chemin pavé de pierres, généralement calcaires, aménagé directement sur le terrain. Après avoir préparé et nivelé le sol, les bâtisseurs disposent les pierres serrées les unes contre les autres, souvent posées de chant pour mieux résister au passage et au ruissellement. Les interstices sont comblés avec des petits cailloux et du matériau fin. Sur une pente, la disposition des pierres et de petites bordures contribue à ralentir l’écoulement de l’eau et à empêcher le ravinement. Cette technique rustique, réalisée sans mortier, donne aux anciens chemins leur aspect irrégulier.","photo":"photos/omimg_20260923_102219.jpg","photoExternal":null,"audio":null,"video":null,"youtube":null},{"name":"Tilleul à feuilles en coeur (Tilia cordata)","lat":43.33084,"lon":5.758613299999999,"alt":704,"comment":"Le tilleul à feuilles en cœur, Tilia cordata, se reconnaît à ses petites feuilles cordiformes, finement dentées, dont la face inférieure porte souvent des touffes de poils roux à l’aisselle des nervures. Ses fleurs jaune pâle, très parfumées, attirent abeilles et autres insectes butineurs. Jadis, le tilleul occupait une place familière dans les villages : on le plantait près des places et des chapelles, où son ombre devenait un lieu de rencontre. Ses fleurs séchées sont encore appréciées en infusion.","photo":"photos/omimg_20260923_102410.jpg","photoExternal":null,"audio":null,"video":null,"youtube":null},{"name":"If commun (Taxus baccata)","lat":43.3281383,"lon":5.7629,"alt":783.84,"comment":"L’if commun, Taxus baccata, semble taillé pour défier le temps. Son feuillage persistant, d’un vert sombre, dissimule un bois rougeâtre d’une remarquable densité, jadis recherché pour fabriquer des arcs. Mais l’arbre joue avec les apparences : presque toutes ses parties sont toxiques, à l’exception de la chair rouge de l’arille, qui enveloppe une graine elle-même dangereuse. Sa longévité exceptionnelle en a fait un arbre associé aux cimetières et aux lieux sacrés. Certains vieux ifs pourraient dépasser largement le millénaire.","photo":"photos/omimg_20260923_104746.jpg","photoExternal":null,"audio":null,"video":null,"youtube":null},{"name":"Christ hissé en croix - Oratoire","lat":43.3274133,"lon":5.7625383,"alt":800.7399999999999,"comment":"Au bord du chemin menant à la grotte Sainte-Marie-Madeleine, cet oratoire évoque l’une des scènes de la Passion : le Christ est représenté au moment où il est hissé sur la croix. Ces petits édicules jalonnent traditionnellement les itinéraires de pèlerinage et offraient aux marcheurs un lieu pour s’arrêter, prier ou méditer. Dans le silence de la forêt de la Sainte-Baume, la scène prend une dimension particulière : chaque station rythme l’ascension et transforme progressivement le chemin forestier en véritable parcours spirituel, jusqu’au sanctuaire aménagé dans la falaise.","photo":"photos/omimg_20260923_105644.jpg","photoExternal":null,"audio":null,"video":null,"youtube":null},{"name":"Souche monumentale","lat":43.32751,"lon":5.7630583,"alt":812.44,"comment":"Cette imposante souche ressemble à une sculpture monumentale abandonnée au cœur de la forêt.  Les racines, désormais exposées, dessinent un étrange réseau de formes tortueuses. Le bois mort n’est pourtant pas une fin : champignons, insectes saproxyliques, mousses et micro-organismes vont progressivement le décomposer et restituer ses éléments minéraux au sol. Ainsi, cette « œuvre » naturelle devient peu à peu un véritable réservoir de biodiversi","photo":"photos/omimg_20260923_105824.jpg","photoExternal":null,"audio":null,"video":null,"youtube":null},{"name":"Tombeau vide du Christ","lat":43.3282167,"lon":5.765245,"alt":832.18,"comment":"Ne vous épouvantez pas. Vous cherchez Jésus le Nazaréen.","photo":null,"photoExternal":null,"audio":null,"video":null,"youtube":null},{"name":"Escalier de la GrotteSainte Marie Madeleine","lat":43.3273467,"lon":5.764596700000001,"alt":872.4700000000001,"comment":"L’escalier actuel menant à la grotte Sainte-Marie-Madeleine a été fait construire en 1913 par le père Marie-Étienne Vayssière, dominicain et gardien de la Sainte-Baume de 1900 à 1932. Il a été aménagé pour rendre l’accès au sanctuaire plus facile et moins dangereux.\n\nIl comporte 150 marches, chiffre choisi symboliquement en référence aux 150 Ave Maria du Rosaire. Le projet était également conçu comme un chemin de croix, dont les dernières stations monumentales se trouvent près de l’entrée de la grotte.","photo":"photos/omimg_20260923_111722.jpg","photoExternal":null,"audio":null,"video":null,"youtube":null},{"name":"Benoîte des bois (Geum sylvaticum)","lat":43.32706,"lon":5.76464,"alt":873.4299999999998,"comment":"La benoîte des bois, Geum sylvaticum, passe facilement inaperçue sous les grands arbres, où ses petites fleurs jaunes semblent chercher une trouée de lumière. Cette vivace de la famille des Rosacées possède des feuilles basales profondément découpées et des fruits munis de petits crochets, véritables « hameçons » végétaux qui s’accrochent aux pelages pour assurer leur dissémination. Son nom évoque les anciennes croyances médicinales attachées aux benoîtes, autrefois recherchées pour leurs racines aromatiques et leurs propriétés supposées.","photo":"photos/omimg_20260923_111935.jpg","photoExternal":null,"audio":null,"video":null,"youtube":null},{"name":"Entrée de la Grottes Sainte Marie Madeleine","lat":43.32689,"lon":5.7643033,"alt":910.89,"comment":"La grotte Sainte-Marie-Madeleine abrite aujourd’hui un sanctuaire aménagé dans une vaste cavité naturelle de la falaise. On y découvre notamment un autel, des statues de Marie-Madeleine et de la Vierge, ainsi que de nombreux ex-voto déposés par les pèlerins. La tradition chrétienne en fait le lieu où Marie-Madeleine aurait vécu les dernières années de sa vie dans la solitude. Une source coule également dans la grotte : son eau, recueillie depuis des siècles, a contribué à la dimension sacrée du lieu.","photo":"photos/omimg_20260923_113256.jpg","photoExternal":null,"audio":null,"video":null,"youtube":null},{"name":"Calvaire","lat":43.32699,"lon":5.7643217,"alt":910.3299999999999,"comment":"le calvaire prolonge le parcours spirituel qui accompagne l’ascension vers le sanctuaire. Les scènes de la Passion rappellent ici le chemin de croix traditionnel, tandis que la falaise forme un décor naturel saisissant. Dans ce lieu marqué depuis des siècles par le pèlerinage, chaque station invitait autrefois le marcheur à ralentir, prier et méditer. Le calvaire témoigne ainsi d’une époque où le sentier de montagne n’était pas seulement un itinéraire : il devenait progressivement un cheminement religieux, rythmé par des images, des haltes et des gestes de dévotion.","photo":"photos/omimg_20260923_113331.jpg","photoExternal":null,"audio":null,"video":null,"youtube":null},{"name":"Pariétaire de Judée (Parietaria judaica)","lat":43.3270667,"lon":5.764336699999999,"alt":912.23,"comment":"La pariétaire de Judée, Parietaria judaica, aime les endroits que d’autres plantes délaissent : vieux murs, fissures de rochers, pieds de falaises et interstices des pierres. Ses tiges rougeâtres portent de petites feuilles ovales, souples, couvertes de poils minuscules qui retiennent poussières et grains de pollen. Son nom populaire évoque son affinité avec les murailles. Autrefois, ses feuilles étaient utilisées en herboristerie, notamment comme plante diurétique. Mais au printemps, son pollen peut provoquer de sérieuses allergies chez les personnes sensibles.","photo":"photos/omimg_20260923_113442.jpg","photoExternal":null,"audio":null,"video":null,"youtube":null},{"name":"Chapelle des Parisiens","lat":43.3287933,"lon":5.7674633,"alt":852.13,"comment":"La chapelle des Parisiens, perchée sur le versant de la Sainte-Baume, rappelle l’ancien rayonnement du pèlerinage auprès des voyageurs venus de loin. Son nom ferait référence aux pèlerins originaires de Paris, qui fréquentaient le sanctuaire de Marie-Madeleine. Édifiée sur l’un des itinéraires conduisant à la grotte, elle constituait une halte propice au recueillement avant de poursuivre l’ascension. Dans ce paysage forestier, la petite construction paraît modeste, mais elle témoigne de l’intensité des déplacements religieux autrefois organisés vers la Sainte-Baume.","photo":"photos/omimg_20260923_114830.jpg","photoExternal":null,"audio":null,"video":null,"youtube":null},{"name":"Cerfeuil sauvage (Anthriscus sylvestris)","lat":43.3275817,"lon":5.76952,"alt":931.23,"comment":"Le cerfeuil sauvage, Anthriscus sylvestris, donne aux lisières une allure de dentelle blanche au printemps. Ses ombelles composées, portées par de hautes tiges creuses, semblent flotter au-dessus du feuillage finement découpé. Mais derrière cette élégance se cache une famille à surveiller : les Apiacées comptent plusieurs espèces toxiques difficiles à distinguer pour un œil non averti. Une simple confusion avec une autre ombellifère peut avoir de lourdes conséquences. Ici, mieux vaut donc admirer le cerfeuil… sans le transformer en bouquet pour la cuisine.","photo":"photos/omimg_20260923_120942.jpg","photoExternal":null,"audio":null,"video":null,"youtube":null},{"name":"Falaise de la Sainte Baume","lat":43.3276617,"lon":5.770186699999999,"alt":945.6299999999999,"comment":"La Sainte-Baume raconte près de 200 millions d’années d’histoire géologique. Les calcaires se déposent au Jurassique dans une mer chaude et peu profonde, puis sont profondément enfouis et lithifiés. Au Cénozoïque, les déformations tectoniques liées aux mouvements des plaques plissent et redressent ces couches, formant le grand anticlinal de la Sainte-Baume. L’érosion attaque ensuite préférentiellement les terrains les moins résistants, tandis que les calcaires jurassiques préservent les reliefs. Failles, diaclases, karstification et éboulements façonnent progressivement la spectaculaire falais","photo":"photos/omimg_20260923_121730.jpg","photoExternal":null,"audio":null,"video":null,"youtube":null},{"name":"Genévrier sabine (Juniperus sabina)","lat":43.3273083,"lon":5.7688167,"alt":956.03,"comment":"Le genévrier sabine, Juniperus sabina, est un petit conifère au port souvent prostré, adapté aux rocailles et aux pentes calcaires de montagne. Ses rameaux portent des feuilles squamiformes et dégagent, lorsqu’on les froisse, une odeur résineuse très particulière. Cette plante discrète a pourtant une réputation ancienne : autrefois utilisée en médecine populaire, la sabine était recherchée pour ses propriétés, mais son huile essentielle est fortement toxique. Les anciens herboristes savaient donc qu’une plante médicinale pouvait aussi devenir un véritable poison.","photo":"photos/omimg_20260923_122647.jpg","photoExternal":null,"audio":null,"video":null,"youtube":null},{"name":"Germandrée blanc grisâtre (Teucrium pollium)","lat":43.32728,"lon":5.768629999999999,"alt":957.5300000000001,"comment":"La germandrée blanc grisâtre, Teucrium polium, semble avoir été saupoudrée de farine : ses feuilles et ses tiges sont couvertes d’un feutrage de poils fins qui lui donne cette teinte argentée. Cette pilosité limite les pertes d’eau et réfléchit une partie du rayonnement solaire, adaptation précieuse sur les terrains secs et rocailleux. Ses petites fleurs, généralement rosées à blanchâtres, attirent les insectes butineurs. Autrefois, les germandrées étaient réputées pour leurs usages médicinaux ; certaines préparations traditionnelles ont toutefois révélé leur toxicité?","photo":"photos/omimg_20260923_122816.jpg","photoExternal":null,"audio":null,"video":null,"youtube":null},{"name":"Filaire à feuilles larges (Phyllirea latifolia)","lat":43.3270583,"lon":5.7676683,"alt":964.33,"comment":"Le filaire à feuilles larges, Phyllirea latifolia, est un arbuste méditerranéen à feuillage persistant, capable de supporter les longues sécheresses estivales. Ses feuilles coriaces, opposées et luisantes évoquent celles d’un petit laurier, tandis que ses discrètes fleurs blanchâtres exhalent un parfum délicat au printemps. Ses fruits, de petites drupes bleu-noir, nourrissent les oiseaux qui participent à la dissémination des graines. Autrefois, son bois dense était apprécié pour les petits ouvrages et le tournage. Dans la garrigue, il constitue aussi un excellent refuge pour la faune.","photo":"photos/omimg_20260923_123101.jpg","photoExternal":null,"audio":null,"video":null,"youtube":null},{"name":"Erable de Montpellier (Acer monspessulanum)","lat":43.32696,"lon":5.76668,"alt":970.33,"comment":"L’érable de Montpellier, Acer monspessulanum, semble avoir adopté une stratégie de discrétion : ses petites feuilles coriaces, généralement trilobées, résistent au soleil et à la sécheresse sans attirer l’attention. En automne, pourtant, il change de costume et embrase les sous-bois de teintes jaunes, orangées ou rougeâtres. Ses fruits doubles, les samares, tournent comme de minuscules hélices lorsqu’ils tombent. Cette architecture aérienne n’est pas qu’élégante : elle permet au vent d’emporter les graines loin de l’arbre mère, jusque dans les fissures des falaises et les éboulis.","photo":"photos/omimg_20260923_123343.jpg","photoExternal":null,"audio":null,"video":null,"youtube":null},{"name":"Statue de Sainte Marie Madeleine en pénitence","lat":43.3271033,"lon":5.7649683,"alt":987.9299999999998,"comment":"La chapelle du Saint-Pilon, sur les crêtes de la Sainte-Baume, est liée à la légende de sainte Marie-Madeleine : sept fois par jour, des anges l'y élevaient pour écouter les chœurs célestes (le « pilon » désignant le pilier commémorant ce miracle).\n\nDétruit à la Révolution, le site a été restauré et abrite une œuvre contemporaine de Jean-Joseph Chevalier représentant la sainte portée par les anges. Ce lieu de pèlerinage offre un panorama unique sur toute la Provence.","photo":"photos/omimg_20260923_123910.jpg","photoExternal":null,"audio":null,"video":null,"youtube":null},{"name":"Vipérine commune (Echium vulgare)","lat":43.32717,"lon":5.7652317,"alt":993.43,"comment":"La vipérine commune, Echium vulgare, porte un nom qui intrigue autant que sa silhouette hérissée. Sa tige couverte de soies raides et ses inflorescences en épis évoquent vaguement la peau d’un serpent, mais c’est surtout la couleur des fleurs qui attire le regard : d’abord rosées, elles deviennent bleu violacé après l’anthèse. Cette métamorphose accompagne le changement de composition du nectar et guide les pollinisateurs. Très mellifère, la vipérine transforme ainsi les terrains secs et pierreux en véritables stations-service pour les abeilles et les bourdons.","photo":"photos/omimg_20260923_134634.jpg","photoExternal":null,"audio":null,"video":null,"youtube":null},{"name":"Cerisier de Sainte Lucie (Prunus mahaleb)","lat":43.3269967,"lon":5.76685,"alt":971.53,"comment":"Le cerisier de Sainte-Lucie, Prunus mahaleb, est un petit arbre des lisières et des coteaux calcaires, reconnaissable à ses feuilles arrondies et surtout à son parfum d’amande amère. Au printemps, ses fleurs blanches en bouquets embaument les sous-bois, puis viennent de petites drupes noires, appréciées des oiseaux. Son bois, dense et fin, fut autrefois recherché en ébénisterie et pour fabriquer de petits objets. Quant à ses noyaux, ils ont longtemps servi à parfumer pâtisseries et liqueurs : un usage ancien qui explique le nom populaire de « bois de Sainte-Lucie ».","photo":"photos/omimg_20260923_135205.jpg","photoExternal":null,"audio":null,"video":null,"youtube":null},{"name":"Crête de la Sainte Baume","lat":43.3272867,"lon":5.768595,"alt":957.2299999999999,"comment":"Le sentier de crête de la Sainte-Baume, jalonné par le GR9, longe la vertigineuse muraille calcaire du massif entre 900 et 1 000 mètres d'altitude. C'est un parcours aérien et spectaculaire qui relie la grotte de Marie-Madeleine à la chapelle du Saint-Pilon. Il offre un panorama grandiose à 360°, plongeant au sud vers la Méditerranée et dominant au nord les forêts de hêtres. Bien qu'exceptionnel, ce sentier demande de la vigilance en raison des falaises abruptes et des violentes rafales de mistral.","photo":"photos/omimg_20260923_135607.jpg","photoExternal":null,"audio":null,"video":null,"youtube":null},{"name":"Marie-Madeleine et la barque miraculeuse","lat":43.3275167,"lon":5.7700833,"alt":950.96,"comment":"Selon une ancienne tradition provençale, après la mort du Christ, Marie-Madeleine aurait quitté la Terre sainte avec sa sœur Marthe, son frère Lazare et plusieurs compagnons. Chassés de Palestine, ils auraient été abandonnés en mer sur une barque sans voile ni gouvernail, condamnée à dériver. Mais, raconte la légende, une intervention miraculeuse les aurait conduits jusqu’aux rivages de Provence, à l’endroit appelé aujourd’hui les Saintes-Maries-de-la-Mer. Marie-Madeleine aurait ensuite gagné la Sainte-Baume, où elle aurait vécu en ermite dans la grotte.","photo":"photos/omimg_20260923_135857.jpg","photoExternal":null,"audio":null,"video":null,"youtube":null},{"name":"Amélanchier à feuilles ovales (Amelanchier ovalis)","lat":43.327505,"lon":5.770061699999999,"alt":952.33,"comment":"","photo":"photos/omimg_20260923_140205.jpg","photoExternal":null,"audio":null,"video":null,"youtube":null},{"name":"Falaise de la Sainte Baume","lat":43.3276467,"lon":5.7700733,"alt":944.9299999999998,"comment":"Le massif de la Sainte-Baume regorge de sentiers exceptionnels entre forêts féeriques et crêtes vertigineuses. La randonnée classique relie l'Hostellerie au Saint-Pilon par la forêt relique et le chemin des Roys. Pour plus de sport, le circuit par le Pas de la Cabre offre une ascension plus sauvage. Comptez aussi sur le sentier marial qui relie les sanctuaires. Ces parcours exigent de bonnes chaussures et de la vigilance face aux à-pics et au mistral.","photo":"photos/omimg_20260923_140353.jpg","photoExternal":null,"audio":null,"video":null,"youtube":null},{"name":"Feuille et bogue de hêtre (Fagus sylvatica)","lat":43.3275767,"lon":5.769855,"alt":946.03,"comment":"Le hêtre roi de la Sainte-Baume se distingue par ses feuilles ovales, au bord ondulé, d'un vert tendre devenant mordoré en automne. Ses fruits, les faînes, s'abritent dans une bogue ligneuse hérissée de doux picots qui s'ouvre à maturité en quatre valves pour les libérer. Symbole de la forêt fraîche et mystique du massif, ces bogues et feuillages tapissent le sol sous la canopée, nourrissant la faune sauvage et offrant un spectacle naturel enchanteur au fil des saisons.","photo":"photos/omimg_20260923_140534.jpg","photoExternal":null,"audio":null,"video":null,"youtube":null},{"name":"Baguenaudier arborescent (Colutea arborescens)","lat":43.3282833,"lon":5.769230000000001,"alt":897.74,"comment":"Même privé de ses curieuses gousses gonflées, le baguenaudier arborescent, Colutea arborescens, reste identifiable. Cet arbuste caduc possède des feuilles composées, formées de nombreuses petites folioles ovales disposées par paires. Au printemps et au début de l’été, ses fleurs jaunes, parfois teintées d’orangé, rappellent celles des autres légumineuses. Ses rameaux souples et son port léger sont caractéristiques. Il affectionne les lisières, les coteaux secs et les terrains calcaires. En hiver, sans feuilles ni fruits, son identification devient en revanche beaucoup plus délicate.","photo":"photos/omimg_20260923_141650.jpg","photoExternal":null,"audio":null,"video":null,"youtube":null},{"name":"Fusain à feuilles larges (Euonymus latifolius)","lat":43.3286917,"lon":5.7669383,"alt":845.4399999999999,"comment":"À l’automne, le fusain à feuilles larges, Euonymus latifolius, abandonne toute discrétion. Ses fruits prennent la forme de capsules à quatre lobes, d’un rose soutenu, qui s’ouvrent à maturité pour dévoiler des graines entourées d’un arille orange vif. Ce contraste spectaculaire attire l’œil bien avant que l’on remarque l’arbuste lui-même. Les oiseaux participent à la dissémination des graines, mais ces fruits ne sont pas comestibles pour l’homme et peuvent provoquer des intoxications. Ici, la nature semble avoir inventé des bijoux végétaux dont la beauté impose de garder les mains à distance.","photo":"photos/omimg_20260923_142608.jpg","photoExternal":null,"audio":null,"video":null,"youtube":null},{"name":"La source de Nans","lat":43.3274877,"lon":5.7700966,"alt":0,"comment":"La source de Nans, au pied de la Sainte-Baume, illustre le fonctionnement du karst dans les puissants calcaires du massif. Les eaux de pluie s’infiltrent dans les fissures et les conduits souterrains, puis circulent dans la roche avant de réapparaître lorsque la structure géologique rencontre des niveaux moins perméables. Son débit peut varier fortement selon les précipitations : discrète après les périodes sèches, la source peut devenir beaucoup plus active après les épisodes pluvieux. Ces résurgences rappellent que, sous la forêt, une partie du paysage se construit dans l’obscurité.","photo":"photos/omimg_20260923_143135.jpg","photoExternal":null,"audio":null,"video":null,"youtube":null},{"name":"Chêne double","lat":43.3274877,"lon":5.7700966,"alt":0,"comment":"La cépée ou le rejet de souche : Beaucoup de chênes anciens de la région ont été exploités autrefois pour le bois de chauffage ou le charbon de bois. Lorsqu'un arbre est coupé à la base, il réagit en émettant plusieurs rejets vigoureux depuis la souche. En grandissant, ces multiples rejets donnent l'illusion de plusieurs troncs distincts serrés ou soudés entre eux.","photo":"photos/omimg_20260923_144009.jpg","photoExternal":null,"audio":null,"video":null,"youtube":null},{"name":"Chêne siège","lat":43.3274877,"lon":5.7700966,"alt":0,"comment":"Ce chêne semble être trois arbres réunis, mais il s’agit probablement d’un seul individu dont le tronc s’est divisé très tôt en plusieurs axes. Chez les chênes, une blessure ancienne, une coupe ou simplement une croissance particulière peut provoquer cette ramification basse. Avec le temps, les trois troncs grossissent séparément tout en restant reliés à une même souche et au même système racinaire. La base devient alors spectaculaire, donnant l’illusion d’une petite forêt concentrée sur quelques mètres carrés. Un bel exemple de la capacité des arbres à adapter leur architecture aux accidents ","photo":"photos/omimg_20260923_144053.jpg","photoExternal":null,"audio":null,"video":null,"youtube":null},{"name":"Cornouiller mâle (Cornus mas)","lat":43.3274877,"lon":5.7700966,"alt":0,"comment":"Le cornouiller mâle (Cornus mas) se reconnaît à sa floraison jaune d'or lumineuse dès février, bien avant l'apparition de ses feuilles ovales, opposées et aux nervures arquées. En été, il arbore de petits fruits rouges comestibles, les « cornouilles », riches en vitamine C. Côté anecdotes, son bois lourd et imputrescible était jadis prisé pour fabriquer des javelots et des manches d'outils. Selon la mythologie, le cheval de Troie aurait même été façonné dans du bois de cornouiller !","photo":"photos/omimg_20260923_144340.jpg","photoExternal":null,"audio":null,"video":null,"youtube":null},{"name":"Marie Madeleine embrassant les pieds du Christ","lat":43.3274877,"lon":5.7700966,"alt":0,"comment":"Cet oratoire représente Marie-Madeleine aux pieds du Christ, dans une scène célèbre des Évangiles. Elle est traditionnellement identifiée à la femme qui, lors d’un repas chez Simon le Pharisien, verse un parfum précieux sur les pieds de Jésus, les lave de ses larmes puis les essuie avec ses cheveux. Sur le chemin de la Sainte-Baume, cette représentation prend une résonance particulière : selon la tradition provençale, Marie-Madeleine aurait ensuite gagné le massif pour y vivre en ermite. L’image associe ainsi le récit biblique à la mémoire légendaire du lieu.","photo":"photos/omimg_20260923_145115.jpg","photoExternal":null,"audio":null,"video":null,"youtube":null},{"name":"Pin noir (Pinus nigra)","lat":43.3273628,"lon":5.7694529,"alt":0,"comment":"Le pin noir se reconnaît surtout à ses aiguilles longues, rigides et groupées par deux, généralement vert sombre, ainsi qu’à son écorce gris-brun profondément fissurée avec l’âge. Sa silhouette est souvent plus massive et moins irrégulière que celle du pin sylvestre. Pour le distinguer de ce dernier, observez le tronc : celui du pin sylvestre présente fréquemment une partie supérieure orangée, absente chez le pin noir. Ses cônes, ovoïdes et sessiles, sont également plus trapus. Attention  : « pin noir » regroupe plusieurs sous-espèces proches, parfois difficiles à séparer sur le terrain.","photo":"photos/omimg_20260923_145757.jpg","photoExternal":null,"audio":null,"video":null,"youtube":null},{"name":"Arrivée","lat":43.3355067,"lon":5.7591317,"alt":671.36,"comment":" Grande randonnée\nHeure de départ: 10:04 23 sept. 2026\nHeure d'arrivée: 15:13 23 sept. 2026\nDistance: 7,5km \nTemps déplacement: 02:42\nVitesse moyenne: 1,46 km/h\nVitesse en mouvement: 2,78 km/h\nVitesse Max.: 7,28 km/h\nAltitude minimale: 669 m\nAltitude maximale: 993 m\nVitesse de montée: 273,7 m/h\nVitesse de descente: 291,2 m/h\nDénivelé positif: 368 m\nDénivelé négatif: 372 m\nTemps de montée: 01:20\nTemps de descente: 01:16","photo":null,"photoExternal":null,"audio":null,"video":null,"youtube":null}];
