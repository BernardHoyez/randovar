#map{height:100vh}
.controls{position:absolute;top:10px;left:10px;z-index:1000;background:white;padding:12px 15px;border-radius:8px;box-shadow:0 2px 10px rgba(0,0,0,.2);display:flex;flex-wrap:wrap;gap:6px;max-width:92vw}
.controls button{padding:10px 16px;border:none;border-radius:5px;cursor:pointer;background:#2d5a1b;color:white;font-size:14px;font-weight:600;white-space:nowrap}

.lp-video{max-height:160px}
.lp-youtube{width:100%;aspect-ratio:16/9;margin:6px 0;display:block;border-radius:4px;border:0}
.lp-youtube-thumb{position:relative;display:block;width:100%;aspect-ratio:16/9;margin:6px 0;border-radius:4px;overflow:hidden;background:#000}
.lp-youtube-thumb img{width:100%;height:100%;object-fit:cover;display:block}
.lp-youtube-thumb .yt-play{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:46px;height:46px;border-radius:50%;background:rgba(220,0,0,.85);color:#fff;font-size:1.1rem;display:flex;align-items:center;justify-content:center;padding-left:3px}
#modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:9999;align-items:center;justify-content:center}
#modal.open{display:flex}
#modal img{max-width:92vw;max-height:88vh;border-radius:8px}
#mx{position:absolute;top:16px;right:16px;width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.2);border:none;color:white;font-size:1.1rem;cursor:pointer}
@media print{.controls{display:none}}
