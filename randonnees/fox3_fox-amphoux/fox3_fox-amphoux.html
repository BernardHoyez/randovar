var wps=[{"name":"Départ","lat":43.57164120732047,"lon":6.099404965201281,"alt":478.27,"comment":"","photo":null,"audio":null,"video":null,"youtube":null},{"name":"Rocher","lat":43.57058,"lon":6.1070683,"alt":479.02,"comment":"","photo":"photos/omimg_20260904_092419.jpg","audio":null,"video":null,"youtube":null},{"name":"Buplèvre raide.JPEG","lat":43.57135166666667,"lon":6.111583333333332,"alt":523.2,"comment":"Buplèvre raide : Le Buplèvre raide (Bupleurum rigidum) se reconnaît ici à ses feuilles coriaces, sessiles et nettement parcourues de nervures longitudinales parallèles, caractères particulièrement visibles avant la floraison. Cette Apiacée vivace affectionne les substrats calcaires secs et les formations herbacées thermophiles. Les feuilles caulinaires, engainantes à la base, sont disposées de manière alterne et présentent une rigidité caractéristique, adaptation aux conditions de sécheresse. L’absence d’inflorescence sur cet individu indique vraisemblablement un stade végétatif précoce.","photo":"photos/bupleuvre_raide.jpg","audio":null,"video":null,"youtube":null},{"name":"Euphraise visqueuse.JPEG","lat":43.58090166666667,"lon":6.1049,"alt":520.1,"comment":"Euphraise visqueuse : L’Euphraise visqueuse (Euphrasia viscosa) est une petite plante annuelle hémiparasite, caractéristique des pelouses maigres, landes et prairies oligotrophes. Ses tiges et ses feuilles sont couvertes de poils glanduleux qui leur confèrent un aspect visqueux, caractère à l’origine de son épithète spécifique. La floraison, estivale, produit de petites fleurs bilabiées, généralement blanchâtres à lilacées, marquées de jaune sur la lèvre inférieure. Comme les autres euphraises, elle prélève une partie de ses ressources minérales sur les racines des graminées voisines.","photo":"photos/euphraise_visqueuse.jpg","audio":null,"video":null,"youtube":null},{"name":"Fumana fausse-bruyere.JPEG","lat":43.580865,"lon":6.104808333333333,"alt":521.6,"comment":"Fumana fausse-bruyère : Le Fumana fausse-bruyère (Fumana ericifolia) est un petit sous-arbrisseau méditerranéen de la famille des Cistacées, caractéristique des pelouses xérophiles, garrigues et substrats calcaires fortement exposés. Ses tiges grêles portent de petites feuilles linéaires, étroites et opposées, évoquant celles des bruyères. La fleur, jaune vif et pentamère, possède cinq pétales rapidement caducs. Cette espèce thermophile et héliophile témoigne de conditions écologiques chaudes, sèches et oligotrophes.","photo":"photos/fumana_fausse-bruyere.jpg","audio":null,"video":null,"youtube":null},{"name":"Lotier à feuilles tenues.JPEG","lat":43.57508666666667,"lon":6.109803333333333,"alt":497.2,"comment":"Le Lotier à feuilles ténues (Lotus tenuis, également appelé Lotier à feuilles étroites ou Lotier glabre) est une plante herbacée vivace de la famille des Fabacées.\n\nCaractéristiques principales :\n\nIl présente des tiges grêles, souvent couchées ou ascendantes.\n\nSes feuilles sont composées de folioles étroites (d'où son nom).\n\nSes fleurs sont d'un jaune vif caractéristique, de petite taille, regroupées en petites ombelles sur des pédoncules.\n\nHabitat : On le rencontre fréquemment dans les prairies humides, les zones sablonneuses ou les terrains exondés, du littoral jusqu'à l'étage montagnard.","photo":"photos/lotier___feuilles_tenues.jpg","audio":null,"video":null,"youtube":null},{"name":"Chapelle Saint Ulfar","lat":43.57065371608142,"lon":6.108797941693426,"alt":477.32,"comment":"La chapelle est dédiée à saint Ulphar, traditionnellement imploré et prié par les villageois pour faire tomber la pluie en période de sécheresse.\nSon édification fait suite à des supplications de la communauté villageoise dont les prières avaient été exaucées. Pour témoigner de leur reconnaissance envers ce « saint salvateur », les habitants décidèrent de bâtir un sanctuaire face à un oratoire préexistant.\n\nL'édifice a été béni le 7 juin 1883 par le curé Rouvier, ainsi qu'en témoigne une plaque commémorative en marbre fixée à l'intérieur.","photo":"photos/omimg_20260904_092714.jpg","audio":null,"video":null,"youtube":null},{"name":"Autel","lat":43.57049677417008,"lon":6.108829323801698,"alt":476.72,"comment":"Saint Ulphar (parfois orthographié Saint Ulfrand ou assimilé à saint Wulfran ou Wulfram, évêque de Sens  est un saint très particulier dans le contexte provençal.\n\nÀ l'origine, ce saint n'appartenait pas du tout au calendrier ni à la tradition liturgique de la Provence, mais était plutôt honoré dans le diocèse de Tulle ou le nord de la France.\nL'origine de son implantation à Fox-Amphoux : Selon la tradition locale, son culte dans le Var serait né à la suite d'un événement insolite. Un habitant (ou un voyageur) effrayé par un violent orage et la foudre aurait imploré ce saint qu'il connaissait.","photo":"photos/omimg_20260904_092903.jpg","audio":null,"video":null,"youtube":null},{"name":"Oratoire","lat":43.5706383,"lon":6.109051700000001,"alt":480.8999999999999,"comment":"Érigés le long des chemins provençaux, les oratoires sont de petits monuments de dévotion voués à invoquer la protection divine. Témoins de la piété populaire, ils balisent les terroirs, marquent les carrefours ou commémorent des vœux face aux épidémies et sécheresses. Composés d'un socle, d'un pilier et d'une niche abritant une statue de saint, ils façonnent l'identité culturelle et paysagère de la région.","photo":"photos/omimg_20260904_093043.jpg","audio":null,"video":null,"youtube":null},{"name":"Salsepareille","lat":43.5714317,"lon":6.1105883,"alt":475.65,"comment":"Les baies de salsepareille (Smilax aspera) poussent en grappes et virent du rouge vif au noir-bleuté à maturité. Contenant des saponines, elles sont toxiques pour l'humain et provoquent des troubles digestifs. Bien qu'inconsommables pour nous (contrairement à la légende des Schtroumpfs), elles constituent un régal pour les oiseaux. En phytothérapie, seules les racines et jeunes pousses sont exploitées.","photo":"photos/omimg_20260904_093519.jpg","audio":null,"video":null,"youtube":null},{"name":"Fox-Amphoux","lat":43.5809867,"lon":6.10525,"alt":473.84,"comment":"Natif de Fox-Amphoux, le vicomte Paul Barras (figure majeure de la Révolution et du Directoire) présenta Joséphine à Napoléon. Ayant échappé à un naufrage, il vint y déposer un ex-voto pieds nus. Le village abrite aussi un vénérable micocoulier centenaire, un gisement paléontologique exceptionnel de dinosaures, ainsi qu'une chapelle troglodytique (Notre-Dame de Bon-Secours) aménagée au pied d'une falaise.","photo":"photos/omimg_20260904_101712.jpg","audio":null,"video":null,"youtube":null},{"name":"Puits","lat":43.57898,"lon":6.1028733,"alt":481.4,"comment":"Élément vital en terre aride, le puits hante la littérature provençale. Chez Marcel Pagnol, il devient le théâtre tragique ou romanesque de la soif et du destin (La Fille du puisatier). Frédéric Mistral y associe la quête sacrée des sourciers et la magie des sources cachées. Puits de village ou modestes citernes de colline symbolisent l'effort collectif, le lien social et la rudesse d'une nature assoiffée magnifiée par les poètes du terroir.","photo":"photos/omimg_20260904_102550.jpg","audio":null,"video":null,"youtube":null},{"name":"Arrivée","lat":43.5720617,"lon":6.099186700000001,"alt":467.8299999999999,"comment":" Grande randonnée\nHeure de départ: 09:16 4 sept. 2026\nHeure d'arrivée: 11:58 4 sept. 2026\nDistance: 7,5km \nTemps déplacement: 02:07\nVitesse moyenne: 2,79 km/h\nVitesse en mouvement: 3,52 km/h\nVitesse Max.: 6,10 km/h\nAltitude minimale: 444 m\nAltitude maximale: 485 m\nVitesse de montée: 93,3 m/h\nVitesse de descente: 97,0 m/h\nDénivelé positif: 92 m\nDénivelé négatif: 101 m\nTemps de montée: 00:59\nTemps de descente: 01:02","photo":null,"audio":null,"video":null,"youtube":null}];
